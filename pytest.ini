[pytest]
testpaths = scripts/tests tests
norecursedirs = scratch archive data backtests/studies .git .gemini .claude __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

