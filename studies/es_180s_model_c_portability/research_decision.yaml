terminal_decisions:
  STRONG_PORTABILITY: 'ES 2024 OOS shows genuine forward discrimination that survives the TRAIN->OOS transfer
    on BOTH directions: ROC-AUC and PR-AUC/base-rate lift retained at a level comparable to the frozen
    NQ 180s parent, stable lift at the frozen ES TRAIN P90/P95/P97.5 thresholds, reasonable calibration,
    and a learned feature structure of the same character as NQ.'
  PARTIAL_PORTABILITY: ES 2024 OOS shows real but materially weaker or one-sided transfer -- e.g. discrimination
    and tail lift hold for one direction only, or lift survives while calibration or timing discrimination
    degrades, or the learned feature ranking diverges substantially from NQ.
  NO_MEANINGFUL_PORTABILITY: 'ES 2024 OOS shows no useful forward discrimination: ROC-AUC at or near chance,
    PR-AUC not meaningfully above the ES 2024 base rate, and no stable lift at the frozen ES TRAIN thresholds.'
  PORTABILITY_CONFIRMED_TAIL_AND_STRUCTURE_UNPROVEN: 'ES 2024 OOS shows genuine two-sided forward discrimination
    that survives the TRAIN->OOS transfer at a level comparable to the frozen NQ 180s parent, so
    NO_MEANINGFUL_PORTABILITY is excluded and PARTIAL_PORTABILITY is contradicted (the transfer is neither
    materially weaker nor one-sided). STRONG_PORTABILITY is a conjunction that cannot be evaluated: two of its
    conjuncts -- stable lift at the frozen ES TRAIN P90/P95/P97.5 thresholds, and a learned feature structure of
    the same character as NQ -- were never produced, because Platform V2 cannot express freeze-time TRAIN
    percentile thresholds (the fit stage derives p90/p95 only on the month_folds path, per fold, and freeze()
    writes thresholds: {} unconditionally) or native feature importance. Added to the vocabulary at close time,
    on the researcher''s decision of 2026-09-06, to record the evidential state accurately rather than misfile a
    two-sided transfer under a label asserting it was weak or one-sided. This decision asserts the primary
    portability finding ONLY; it makes no claim about tail behaviour, timing discrimination or feature structure.
    Superseded if the routed ANALYSIS_HARNESS_GAP is built and the study is re-run.'
autonomy_decisions:
  platform_merge: auto_if_green
  closed_study_merge: auto_if_clean
  deterministic_defect: auto_fix
  audit_fixable_defect: auto_fix
  frozen_parent_evidence: authenticate_and_reuse_never_retrain
  protected_data: never_broaden_chronology_authority
  long_jobs: detached_no_polling
  on_capability_gap: stop_and_handoff
  platform_change_required: chore_branch_and_fresh_session
  calendar_reference_parity: common_interval_exact
  frozen_parent_model: rescore_if_authenticated
  protected_period: never_expand_authority
  horizon: 'flip_within_180s: the interval is (T, T+180s] -- exclusive at the decision epoch T, inclusive
    at the boundary. Parent semantics, unchanged.'
  horizon_end_rule: strict -- no bar closing after the horizon end is evaluated; a bar closing exactly
    at the end is.
  decision_epoch: T is the 5s grid checkpoint anchored on regime_1m.start_ns, read from completed-bar
    state only (features.metadata.triggering_1s_ts_init = epoch.T records it per row).
  session_end: censor -- a candidate whose 180s horizon crosses the RTH session close is censored, never
    labelled 0.
  direction: population.direction = regime_1m.dir, the PREVAILING 1m regime direction read at T. Both
    directions are collected in one population.
  qualify: 'the parent''s established-regime predicates, FIXED, never tuned for ES: regime age >= 120s,
    running MFE >= 1.0 frozen ATR, >= 2 new-progress windows (progress_gap 120s), retained MFE ratio >=
    0.50, 5s candidate cadence, RTH, both prevailing directions, frozen ATR > 0. No max_age cap -- the
    parent caps none, and the >=1800s maturity bucket must stay reachable.'
  cells: the LONG/SHORT split is a modeling CELL partition on regime_direction (+1 / -1), each cell fit
    independently on the identical collected population with the NQ parent's own frozen direction-specific
    hyperparameters. Not arms, not a tuning search.
  thresholds: P90/P95/P97.5 are quantiles of the ES TRAIN score distribution, derived per direction from
    ES TRAIN scores ONLY (derivation_population = train). The percentile DEFINITIONS transfer from NQ;
    the NQ numerical thresholds do NOT.
  analysis_source: no declarative `analysis:` block is declared. Under research_workflow/lifecycle_v2.py
    the analyze stage runs the declared pipeline INSTEAD OF the governed OOS classification path, so declaring
    one would trade the mandatory section-13 OOS metrics for the conditional section-14 first-P90 diagnostic.
    Section 14 is explicitly conditional ("if supported"); section 13 is not.
resolved_from_parent_authority:
  parent_study: studies/clean_maturity_flip_model_180s_horizon
  parent_is: frozen historical v1 REFERENCE -- never recompiled, never retrained, never recollected
  feature_surface:
    source_artifact: artifacts/frozen_feature_manifest.json
    feature_list_sha256: 38c0201fe2b0fec3070b7a226353d7782778aa82bace3b6070de8844d9d04d32
    long_c_equals_short_c: true
    features:
    - arrival_velocity
    - arrival_acceleration
    - ema_slope
    - prior_1m_regime_efficiency
    - prior_1m_regime_mfe_atr
    - prior_1m_regime_range_atr
    - prior_5m_regime_efficiency
    - prior_5m_regime_mfe_atr
    - prior_5m_regime_range_atr
    - rolling_300s_retention_ratio
    - rolling_300s_current_progress_atr
    - rolling_300s_max_progress_atr
    - rolling_300s_giveback_atr
    compiled_plan_features_match: compiled_plan.json columns.features is exactly this set (13/13)
    parameters_carried_verbatim: 'prior 1m/5m regime geometry: context prior, bar_state completed. rolling
      family: window 300s, update_every 1s. arrival_velocity: input_timeframe 1s, lookback 20, bar_state
      completed. arrival_acceleration: input_timeframe 1s, short_lookback 20, bar_state completed. ema_slope:
      ema_role short, lookback 20.'
  fixed_hyperparameters_verified:
    source_artifacts:
    - artifacts/model_selection_manifest_long.json  winner.C.hyperparameters
    - artifacts/model_selection_manifest_short.json winner.C.hyperparameters
    LONG:
      learning_rate: 0.039440343780424526
      max_depth: 5
      n_estimators: 100
      num_leaves: 4
      verbosity: -1
    SHORT:
      learning_rate: 0.028861842631876633
      max_depth: 5
      n_estimators: 200
      num_leaves: 4
      verbosity: -1
    seed: 42
    matches_contract_section_7: true
    random_state_placement: random_state lives ONLY in model.params. research.analysis.modeling._build_estimator
      builds LGBMClassifier(random_state=seed, **cfg); a cell-level random_state would raise "got multiple
      values for keyword argument". The NQ parent recorded the identical hazard in its own study.yaml
      comment.
    no_execution_only_overrides: 'n_jobs / deterministic are deliberately NOT declared: the parent did
      not declare them, and this study changes nothing about the architecture it is testing.'
  population_semantics_source: parent study.yaml population.qualification (age_gate_seconds 120, running_mfe_atr_gte
    1.0, new_progress_windows_gte 2, retained_mfe_ratio_gte 0.5, cadence_seconds 5, session RTH, prevailing_regime
    both)
  target_semantics_source: parent study.yaml target (type flip, event prevailing_1m_regime_transition,
    horizon_seconds 180, confirmation completed_1m_bar / 1 bar, decision_reference decision_ts, direction
    both)
  regime_authority: tracker.regime.dual_ema defaults short_period 3 / long_period 9 / atr_period 14 --
    the canonical dual-EMA regime, same as the parent.
chronology:
  train:
  - 2020
  - 2021
  - 2022
  - 2023
  dev:
  - 2024
  prohibited:
  - 2025
  - 2026
  oos_authorization: the embedded research contract IS the authorization for ES 2024 to open through the
    governed `oos` stage AFTER the TRAIN freeze. It is NOT authorization for 2025 or 2026.
  no_selection_protocol: model.validation is deliberately absent. research_workflow/lifecycle_v2.py fit()
    falls back to tuning = chronology.train, final_train_validation_years = []. No search_space is declared,
    so research_workflow.tuning.tune is never invoked. Nothing adaptive ever runs, and 2024 can enter
    no fitting, selection, calibration or threshold decision by construction.
  note_train_differs_from_parent: the NQ parent trained on 2021-2023. This contract declares ES TRAIN
    2020-2023 explicitly (section 8); that is a contract decision, not an inference.
prohibited_changes:
- add_or_remove_features
- feature_selection
- substitute_approximate_feature_aliases
- change_feature_timing_reset_or_null_semantics
- add_volume_or_delta_features
- hyperparameter_tuning_of_any_kind
- optuna_random_or_grid_search
- es_specific_architecture_selection
- combined_nq_plus_es_model
- retrain_or_recollect_the_nq_parent
- transfer_nq_numerical_score_thresholds_to_es
- optimize_population_thresholds_for_es
- use_2024_for_any_design_or_fitting_decision
- touch_2025_or_2026
- entry_simulation_or_any_economic_work
- study_local_analysis_python
- bespoke_collector_or_wrapped_runner
known_platform_risks_for_later_phases:
  note: Found by reading the runtime while composing this spec; NOT raised by `study compile`, so they
    are recorded here rather than as a CapabilityGap. Phase B/C/D should expect them.
  multi_cell_freeze: research_workflow/lifecycle_v2.py freeze() builds model_canonical_sha256 keyed by
    m["name"] over models["models"]. With more than one (arm x cell) the fit stage writes entries keyed
    arm/cell/model_id with NO "name" key, and `single` is None so no top-level model_id exists -> KeyError
    at freeze. Deterministic defect; autonomy_decisions.deterministic_defect = auto_fix.
  multi_cell_oos_analyze: analyze() reports OOS classification only when models["mode"] == "score" or
    models["model_id"] exists. A multi-cell TRAIN study satisfies neither, so contract section 13 (per-direction
    OOS ROC/PR/Brier/calibration) has no producer today.
  feature_importance: 'contract section 12 (native LightGBM gain/split importance per direction) has no
    producer: no "importance" symbol exists anywhere under research_workflow/ or research/analysis/.'
  train_threshold_artifact: 'contract section 10 P90/P95/P97.5: research_workflow/modeling.py:321-323
    computes exactly these three with derivation_population "train", but that is the v1 path. lifecycle_v2
    freeze() writes thresholds: {} and the fold-level train_derived_thresholds exist only under walk_forward_months
    (and only p90/p95).'
  first_p90_diagnostic: analysis.anchor.first_threshold_crossing requires LITERAL per-case thresholds
    (research/analysis/diagnostic_ops.py resolve_by), which a TRAIN-derived quantile is not at design
    time; and the analyze stage would displace the section-13 OOS path. Section 14 is conditional -- route
    ANALYSIS_HARNESS_GAP if it is wanted.
deliverables:
- compiled feature contract (compiled_plan.json columns.features, 13 entries)
- artifacts/experiment_models.json -- per-cell TRAIN population + classification summary
- artifacts/train_experiment_freeze.json -- frozen LONG + SHORT model bytes, canonical shas, feature order
- ES TRAIN P90/P95/P97.5 per direction, derivation_population = train
- feature importance table per direction
- artifacts/experiment_analysis_v2.json -- 2024 OOS classification + score-tail summary
- maturity-bucket summary (regime_age_seconds metadata column)
- first-P90 summary if supported
- ES-vs-NQ portability comparison (descriptive, against already-frozen NQ evidence)
- artifacts/ES_180S_MODEL_C_PORTABILITY_CARD.json (shape in the embedded contract, section 22)
- artifacts/study_closure.json with a terminal_decisions key above
