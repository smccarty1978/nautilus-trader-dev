# --------------------------------------------------------------------------------------------
# Population identity -- a declared STRICT SUPERSET of the parent's
# --------------------------------------------------------------------------------------------
population_identity:
  relation_to_parent: strict_superset
  collected: >
    RTH, 5s checkpoint grid anchored at regime_1m.start_ns, established regime, age >= 120s,
    frozen ATR > 0, structural snapshot ready. NO maturity gates and NO 1800s age cap.
  parent_eligibility_reimposed_in_analysis:
    - [running_mfe_atr, gte, 1.0]
    - [new_progress_windows, gte, 2]
    - [retained_mfe_ratio, gte, 0.5]
    - [regime_age_seconds, lte, 1800]
  why: >
    Section 9 of the authorization requires frozen-model scoring to CONTINUE after a checkpoint
    ceases to satisfy the parent's candidate eligibility. The parent's three maturity gates and
    its max_age=1800s grid cap both end the checkpoint stream early, so a study restricted to the
    parent's population cannot observe the anchored score path at all. Verified against the parent:
    first-fire age ranges 160-1755s, 9.2% of fires have under 600s of grid headroom before the
    1800s cap and 0.84% have under 120s, so the +120s scheduled score does not exist for them.
    Carrying the gates as METADATA and re-imposing them in the analysis makes the parent-eligible
    subset -- and therefore the first-P90 identity -- exactly the parent's, while leaving the rest
    of the frame available to the score path.
  population_parity_gate: >
    STOP GATE, EXECUTABLE. Declared as analysis step `population_parity_gate`
    (op analysis.gate.population_parity) immediately after the anchors and before every
    statistic, so a drifted population aborts the analyze stage with NO artifact written.
    It requires: reference bytes sha256 52437d73c1cf0705001bb2534d1c3a6e8cbe401585f46e3534968c7bb1e22616
    (validation_march2024/artifacts/first_p90_parity.parquet); 239 anchors total;
    LONG 115 / SHORT 124; the anchor regime_start_ns set EXACTLY equal to the reference
    regime_id set, no key on one side only; and every anchor's observation_ts equal to the
    reference nt_first_P90_ts. Evidence artifact: first_p90_population_parity.json.
    Prose alone is not a gate -- the first contract audit BLOCKED this study precisely because
    this requirement was declared here and wired to nothing.

# --------------------------------------------------------------------------------------------
# Declared semantic decisions (golden rule 14: declared, never inferred)
# --------------------------------------------------------------------------------------------
semantic_decisions:
  null_input_policy:
    declared: model_native
    where: study.yaml features.derived_inputs[].null_input_policy
    platform_default: refuse
    decision: >
      Pass a null model input to the frozen estimator instead of refusing to score, because that
      is how the frozen models were ACTUALLY USED. This changes no model byte, no threshold, no
      ordered feature surface and no preprocessing identity -- only this study's declared handling
      of a missing INPUT, so that the population reproduced is the parent's.
    evidence:
      artifact: artifacts/parity/frozen_180s_null_input_policy_evidence.json
      march_candidates_scored_by_parent: 35872 of 35872
      march_candidates_with_null_rolling_300s: 26018
      frozen_first_p90_fires_on_a_null_rolling_row: 181 of 239
      end_to_end_binding_check: >
        The real host binding, driven over the parent's own March feature rows for all 239 frozen
        fires, scored 239/239 with max|binding - parent_recorded| = 0.000e+00 in both directions.
    counterfactual: >
      Under the platform default the smoke day left 1,242 of 1,791 parent-eligible checkpoints
      (69%) unscored and 76% of the frozen fires unreachable -- a different population, not a
      more conservative one.
  outcome_session_end:
    declared: truncate
    where: study.yaml outcome.session_end
    decision: >
      The RTH close BOUNDS the observation window rather than voiding it. Under the platform
      default (censor) a horizon long enough to reach the close censors EVERY candidate, so
      time-to-next-flip through session end could not be measured at all.

# --------------------------------------------------------------------------------------------
# Chronology and data authorization
# --------------------------------------------------------------------------------------------
chronology:
  train: [2024]              # collection role; NOTHING is fitted (model: none)
  dev: []
  diagnostic: [2024]
  prohibited: [2020, 2021, 2022, 2023, 2025, 2026]
  windows: ['2024-03-01..2024-03-31']
  note: >
    2024 carries the train ROLE only because that is the role the V2 controller executes; the
    study fits nothing (model: none) and no protected out-of-sample period exists (freeze records
    NO_PROTECTED_OOS). The window narrows execution to March. March 2024 was already opened and
    analysed by the parent, so this study makes NO new untouched-OOS claim.

# --------------------------------------------------------------------------------------------
# Predeclared analysis semantics -- frozen BEFORE execution
# --------------------------------------------------------------------------------------------
predeclared_semantics:
  first_p90_fire: earliest parent-eligible checkpoint in the prevailing regime with score >= frozen P90 (inclusive, one per regime)
  terminal: min(resolved_at_ts) -- the earliest of the accepted opposing flip and the RTH session close
  next_flip_horizons: [60, 120, 180, 240, 300, 450, 600]
  incidence_eligibility: resolved at or before h OR observed for at least h
  negative_denominator_at: 180
  score_path_offsets: [15, 30, 60, 90, 120]
  score_path_cap_seconds: 600
  subtype_precedence: [SESSION_CENSORED, FAST_RESOLVER, LATE_RESOLVER, SLOW_RESOLVER, FAILED_WARNING_SCORE_COLLAPSE, FAILED_WARNING_PERSISTENT_HIGH]

control_design:
  stratification: [direction]
  min_n: 30
  selection: latest parent-eligible checkpoint below the frozen directional P90 in the cell; strictly before the fire for a regime that fired
  deviation_from_request:
    requested: direction x age_bucket x time_of_day (60-minute bins), min_n 30
    changed_to: direction only
    decided_before_execution: true
    reason: >
      Computed on the parent's OWN frozen 239 March fires before this study was created: the
      requested stratification occupies 42 cells with a MAXIMUM cell size of 13, so ZERO cells
      reach the locked n >= 30 rule and the control question would have been unanswerable by
      construction. Collapsed to direction x age_bucket, 4 of 6 cells clear 30 and both
      [900,1800) cells land at exactly 29. Direction only (115 / 124) is the only stratification
      March can actually populate. Age and time-of-day remain DESCRIPTIVE, reported with their
      cell counts and no reportability claim.
  age_bucket_note: >
    The locked >= 1800s age bucket is EMPTY BY CONSTRUCTION under the parent's population: its
    grid stops at max_age 1800s, so no checkpoint, fire or control can have an age above it
    (observed first-fire age range 160-1755s). Reported as structurally empty, not as a null result.

