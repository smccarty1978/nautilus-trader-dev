# Authoritative decision contract (research_decision.yaml > SPEC.md > study.yaml > compiled_plan.json > code)
study_id: first_p90_warning_horizon_march2024
status: DRAFT
dataset_id: NQ_1S_V2_GLOBEX
decision_type: governed_diagnostic_characterization

research_question: >
  When a regime produces its first frozen-model P90 warning but does not flip within the frozen
  180-second label horizon, how often is that warning merely EARLY versus genuinely FALSE?

secondary_questions:
  - Does first P90 accelerate time-to-next-opposing-flip relative to comparable eligible non-P90 states?
  - Does the causal score path after first P90 separate fast, late and failed warnings?
  - Is persistence/rising score after first P90 more informative than the magnitude of the first-fire score?

objective: >
  Descriptive characterization only. No model development, no strategy optimization, no Stage 2.

# --------------------------------------------------------------------------------------------
# Platform provenance
# --------------------------------------------------------------------------------------------
platform_provenance:
  branched_from: chore/v2-diagnostic-window-and-analysis
  base_commit: c9253c20baf247e00586faf7023d2cee274c496b
  reason: >
    WORKFLOW.md section M.1 -- this study is bound to a platform state that is not yet on main.
    Three capabilities it depends on were added on that chore branch because the study could not
    otherwise be expressed at all:
      * chronology.windows        -- date-bounded partition execution. Without it a V2 study can
                                     only run whole calendar years, so running March 2024 would
                                     have meant streaming April-December 2024, which section 14
                                     of the authorization prohibits.
      * analysis:                 -- declarative post-collection analysis over registered
                                     analysis_ops. Without it the analyze stage emits only
                                     roc_auc/pr_auc/brier and disposition counts, and none of the
                                     required statistics could be produced without a study-local
                                     pandas script (prohibited by CLAUDE.md section 5).
      * outcome.session_end:      -- truncate. Under censor a flip horizon reaching past the
                                     session close is CENSORED whether or not the flip happened,
                                     so "time to the next flip, observed through RTH close" was
                                     not expressible: every candidate would have been censored.
  merge_expectation: >
    The chore branch merges to main with --no-ff; this study's closure is bound to that platform
    state and its execution composite is recorded in audit/frozen_execution_manifest.json.

