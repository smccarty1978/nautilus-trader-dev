# NQ MULTI-TIMEFRAME REGIME PATH ATLAS -- ONE-YEAR PILOT (2023)
# THE FOUR STAGES, step 1: a `stage: collect` study. It produces an immutable FRAME (one row per
# completed 1m bar of every 1m dual-EMA regime in 2023, ETH and RTH), makes no claim, fits no
# model, declares no analysis. The tables (T1-T8, contract section 8) are produced by EXPLORE
# (step 4) over the registered frame, from registered analysis_ops only.
#
# The full research contract is docs/questions/nq_mtf_regime_atlas_pilot2023.md; the authoritative
# decision contract is studies/nq_mtf_regime_atlas_pilot2023/research_decision.yaml (which wins over
# this file). OWNER AMENDMENT 01 applies: single 1m anchor (A1), Globex trading-day censoring (A2).
#
# Every feature id here is REGISTERED (research cap describe) at the timeframes it declares. The
# contract's section 7 blocks that no registered feature provides (VWAP, ATR percentile, session
# bucket, day of week, minutes-to-RTH-close, overnight gap, prior-session high/low; gap_inventory G4)
# and the regime feature family at 30s/3m/15m/30m/1h/4h (G3) are NOT composed here: the raw tracker
# state of every timeframe at T (direction, age, bars, start, ATR) is carried as metadata columns
# instead, so a later selection or EXPLORE reads alignment as a filter, never a re-collection.
stage: collect

study:
  id: nq_mtf_regime_atlas_pilot2023
  tier: 2
  question: "Descriptively, how does an NQ 1m dual-EMA regime move after it flips -- MFE/MAE path at fixed 1m bar offsets, path ordering, giveback and realized outcome in ATR -- and how does that differ by higher-timeframe alignment (5s/30s/3m/5m/15m/30m/1h/4h context at T), session and volatility context (2023 pilot)?"
  description: "Descriptive orientation, not falsification. Census of every 1m regime flip across ETH and RTH for 2023 only, with one checkpoint per completed 1m bar until the next 1m flip. Nothing found here is a finding."

streams:
  # 1s is the execution stream (epochs). 1s and 1m are external in the DatasetSpec; every other
  # timeframe is a host-derived completed calendar bucket of them (contract Appendix A1).
  - {dataset: NQ_1S_V2_GLOBEX, timeframes: [1s, 5s, 30s, 1m, 3m, 5m, 15m, 30m, 1h, 4h]}

context:
  # contract section 3: the SAME regime definition on every timeframe -- one tracker capability,
  # accepted default dual-EMA band parameters and Wilder ATR(14), varying only "timeframe".
  regime_5s:  {tracker: regime.dual_ema, timeframe: 5s}
  regime_30s: {tracker: regime.dual_ema, timeframe: 30s}
  regime_1m:  {tracker: regime.dual_ema, timeframe: 1m}
  regime_3m:  {tracker: regime.dual_ema, timeframe: 3m}
  regime_5m:  {tracker: regime.dual_ema, timeframe: 5m}
  regime_15m: {tracker: regime.dual_ema, timeframe: 15m}
  regime_30m: {tracker: regime.dual_ema, timeframe: 30m}
  regime_1h:  {tracker: regime.dual_ema, timeframe: 1h}
  regime_4h:  {tracker: regime.dual_ema, timeframe: 4h}
  # contract sections 5 and 6: running MFE / MAE / realized progress of the CURRENT 1m regime since
  # its start, in the 1m regime's own frozen ATR, measured on 1m bars (path offsets are "bars OF
  # THAT TIMEFRAME" -- 1m for the 1m anchor).
  excursion_1m: {tracker: regime.excursion, bars: 1m, regime: regime_1m}

population:
  # OWNER AMENDMENT 01 A1: SINGLE ANCHOR, 1m regime flips only. One candidate per completed 1m bar
  # of every 1m regime; identity is the regime start; the flip row is checkpoint 0 (bars_1m == 1).
  # contract section 0 / A2: ETH and RTH both, distinguished by feature.session_membership, never
  # merged and never filtered.
  session: ALL
  cadence: completed_1m
  # contract section 4 / COLLECT rule: NO qualify. Census, not a qualified population.
  direction: regime_1m.dir
  anchor_identity: regime_1m.start_ns

triggers: every_candidate

features:
  # Only instances a registered RuntimeProviderAdapter can render at collection time are composed
  # (research_workflow/provider_host.py ADAPTER_REGISTRY). Registered features whose provider has
  # no adapter (session_membership, session_elapsed, relative_volume, activity_flip_count, the
  # regime family at 5s/30s/3m/15m/30m/1h/4h) are recorded in research_decision.yaml G6, not
  # composed. The ETH/RTH flag therefore comes from triggering_1s_ts_init against the dataset's
  # committed sessions table downstream, never from a filter here.
  instances:
    # --- contract section 7 ALIGNMENT (registered + bindable): 1m vs 5m agreement, 5m direction/age
    - {feature: regime_alignment, source_timeframe: 1m, reference_timeframe: 5m, context: current, bar_state: completed}
    - {feature: regime_direction, timeframe: 5m, context: current, bar_state: completed}
    - {feature: regime_age_min,   timeframe: 5m, context: current, bar_state: completed}

    # --- contract section 7 PRIOR STATE: the prior regime on 1m (same timeframe) and on 5m
    - {feature: regime_efficiency,               over: {timeframe: [1m, 5m]}, context: prior, bar_state: completed}
    - {feature: regime_mfe_atr,                  over: {timeframe: [1m, 5m]}, context: prior, bar_state: completed}
    - {feature: regime_duration_min,             over: {timeframe: [1m, 5m]}, context: prior, bar_state: completed}
    - {feature: regime_net_directional_move_atr, over: {timeframe: [1m, 5m]}, context: prior, bar_state: completed}
    - {feature: regime_range_atr,                over: {timeframe: [1m, 5m]}, context: prior, bar_state: completed}

    # --- contract section 6 PATH on the 5m context regime (current + completed is supported at 5m)
    - {feature: regime_mfe_atr,    timeframe: 5m, context: current, bar_state: completed}
    - {feature: regime_efficiency, timeframe: 5m, context: current, bar_state: completed}
    - {feature: regime_range_atr,  timeframe: 5m, context: current, bar_state: completed}

    # --- contract section 7 PRIOR STATE: distance to the completed 5m range extremes in ATR
    - {feature: distance_to_completed_range_high_atr, reference_timeframe: 5m, bar_state: completed}
    - {feature: distance_to_completed_range_low_atr,  reference_timeframe: 5m, bar_state: completed}

    # --- contract section 7 VOLUME (OHLCV/delta provider, bindable): the flip bar's own volume,
    #     the last 1m of volume vs the trailing 20m (flip-bar volume vs prior N bars), and the
    #     estimated delta ratio over the last 1m. Volume/delta are ESTIMATED from bar geometry.
    #     Single-year pilot: raw volume is never compared across years (contract section 7).
    - {feature: bar_volume, context: bar}
    - {feature: vol_sum_vs_ratio, context: rolling, timeframe: 60s, timeframe_2: 1200s}
    - {feature: est_delta_ratio,  context: rolling, timeframe: 60s}

  metadata:
    triggering_1s_ts_init: epoch.T
    # --- the 1m anchor: regime state at T
    dir_1m:        regime_1m.dir
    prev_dir_1m:   regime_1m.prev_dir
    flipped_1m:    regime_1m.flipped
    bars_1m:       regime_1m.bars_in_regime
    age_s_1m:      regime_1m.age_s
    start_ns_1m:   regime_1m.start_ns
    start_price_1m: regime_1m.start_price
    atr_1m:        regime_1m.atr
    frozen_atr_1m: regime_1m.frozen_atr
    # --- contract section 6 PATH of the 1m regime at every 1m checkpoint, in the 1m frozen ATR.
    #     time-to-MFE, time-to-MAE, which came FIRST, MFE retained (giveback) and the MAE-before-MFE
    #     flag are read off this per-bar sequence at EXPLORE; never reconstructed from a terminal.
    mfe_atr_1m:          excursion_1m.mfe_atr
    mae_atr_1m:          excursion_1m.mae_atr
    pnl_atr_1m:          excursion_1m.pnl_atr
    retained_1m:         excursion_1m.retained_ratio
    progress_windows_1m: excursion_1m.progress_windows
    highest_high_1m:     excursion_1m.highest_high
    lowest_low_1m:       excursion_1m.lowest_low
    last_close_1m:       excursion_1m.last_close
    # --- contract section 7 ALIGNMENT at the other eight timeframes: direction, age, bars, start
    #     and ATR of each context regime at T (raw tracker state; agrees/disagrees is a sign
    #     comparison against dir_1m at EXPLORE, a filter not a re-collection).
    dir_5s:  regime_5s.dir
    dir_30s: regime_30s.dir
    dir_3m:  regime_3m.dir
    dir_5m:  regime_5m.dir
    dir_15m: regime_15m.dir
    dir_30m: regime_30m.dir
    dir_1h:  regime_1h.dir
    dir_4h:  regime_4h.dir
    age_s_5s:  regime_5s.age_s
    age_s_30s: regime_30s.age_s
    age_s_3m:  regime_3m.age_s
    age_s_5m:  regime_5m.age_s
    age_s_15m: regime_15m.age_s
    age_s_30m: regime_30m.age_s
    age_s_1h:  regime_1h.age_s
    age_s_4h:  regime_4h.age_s
    bars_5s:  regime_5s.bars_in_regime
    bars_30s: regime_30s.bars_in_regime
    bars_3m:  regime_3m.bars_in_regime
    bars_5m:  regime_5m.bars_in_regime
    bars_15m: regime_15m.bars_in_regime
    bars_30m: regime_30m.bars_in_regime
    bars_1h:  regime_1h.bars_in_regime
    bars_4h:  regime_4h.bars_in_regime
    start_ns_5s:  regime_5s.start_ns
    start_ns_30s: regime_30s.start_ns
    start_ns_3m:  regime_3m.start_ns
    start_ns_5m:  regime_5m.start_ns
    start_ns_15m: regime_15m.start_ns
    start_ns_30m: regime_30m.start_ns
    start_ns_1h:  regime_1h.start_ns
    start_ns_4h:  regime_4h.start_ns
    # contract section 5: RAW ATR denominators of all nine timeframes so both normalizations (own
    # 1m ATR primary, 1h ATR secondary) are auditable.
    atr_5s:  regime_5s.atr
    atr_30s: regime_30s.atr
    atr_3m:  regime_3m.atr
    atr_5m:  regime_5m.atr
    atr_15m: regime_15m.atr
    atr_30m: regime_30m.atr
    atr_1h:  regime_1h.atr
    atr_4h:  regime_4h.atr

  bindings:
    completed_1m: {stream: 1m, regime: regime_1m}
    completed_5s: {tracker: regime_5s, ready_gate: true}
    completed_5m: {tracker: regime_5m, ready_gate: true}
    regime_transition_1m: {tracker: regime_1m, requires_atr: true}
    snapshot:
      atr: regime_1m.atr
      family_a_atr: excursion_1m.frozen_atr
      episode_state:
        prevailing_direction: regime_1m.dir

outcome:
  # contract section 6 OUTCOME: realized return from the flip bar CLOSE to the NEXT 1m flip bar CLOSE,
  # signed by direction, in own-timeframe ATR. The terminal is the next flip -- not a clock horizon.
  # "horizon" is the observation bound only: longer than any Globex trading day, so the trading-day
  # close (session: TRADING_DAY, OWNER AMENDMENT 01 A2) is what censors. A regime still open at the
  # trading-day close, at a data gap (max_gap) or at the chronology boundary is CENSORED and flagged.
  kind: label
  event: regime_1m.flipped
  direction: regime_1m.dir
  atr: regime_1m.atr
  atr_availability: through_decision_ts
  entry_reference: decision_close
  horizon: 24h
  horizon_end_rule: strict
  max_gap: 300s
  session: TRADING_DAY
  session_end: censor
  label_column: target_next_flip_1m

chronology:
  # contract section 10. EXPLORE: 2023 only. 2026 PROHIBITED. 2020/2021/2022/2024/2025 are simply
  # not partitions of this pilot (warmup reads calendar days immediately before the 2023 partition).
  train: [2023]
  dev: []
  prohibited: [2026]
  warmup: {days_before_partition: 5, candidate_emission: false, target_generation: false}
  authorized_dates: ['2023-10-02']

# contract section 11: NO models, no economics. A collect study declares no analysis and no
# deliverables; EXPLORE (step 4) produces the tables over the registered frame.
model: none
