# EXPLORE (THE FOUR STAGES, step 4) over the registered pilot frame.
# Registered analysis_ops ONLY. Tables the contract asks for that have no registered producer
# (grouped descriptive summary by outcome sign for T1/T5/T7/T8; session-day-clustered
# uncertainty, contract section 9) are NOT computed here -- they are reported as unsatisfied in
# the session report (gap_inventory.G5).
#
# REPAIRED 2026-09-14 against frame 80e644d1 (declarative only):
#   - rule ops use the op's vocabulary (eq/gt/...), not symbols; `explore compile` did not check them.
#   - the flip (anchor) row is flipped_1m == true, which is bars_1m == 0 (28,029 rows), NOT
#     bars_1m == 1 (27,480 rows: the NEXT checkpoint; 550 one-bar regimes have none).
#   - T2 (analysis.incidence.cumulative) is NOT run: it requires observed_seconds_column and the
#     flip kernel's frame carries no observed-seconds column (observations: flip_ts,
#     time_to_flip_seconds, horizon_end_ts, session_close_ts, resolved_at_ts). No registered op
#     derives one. T2 is an unsatisfied requirement, not substituted with time_to_flip_seconds.
explore:
  id: nq_mtf_regime_atlas_pilot2023_census
  question: "T6 (1m census: flips, censored counts by reason, by direction) over the 2023 pilot frame"

analysis:
  steps:
    # T6 -- population census of 1m flips. The first rule sets aside every non-anchor checkpoint;
    # the remaining rules classify each FLIP by how its regime resolved. counts[] is the census;
    # by_stratum splits it by the new regime's direction.
    - id: t6_census
      op: analysis.classify.precedence
      rows: frame
      params:
        output_column: t6_class
        strata: [regime_direction]
        rules:
          - {label: checkpoint_not_anchor, when: [[flipped_1m, eq, false]]}
          - {label: flip_censored_session_end, when: [[censored, eq, 1], [censor_reason, eq, SESSION_END]]}
          - {label: flip_censored_gap,         when: [[censored, eq, 1], [censor_reason, eq, GAP]]}
          - {label: flip_censored_other,       when: [[censored, eq, 1]]}
          - {label: flip_resolved_next_flip,   when: [[target_flip_within_horizon, eq, 1]]}
          - {label: flip_unresolved_horizon,   when: []}

  artifacts:
    - {name: t6_census.json, source: t6_census, kind: json}
