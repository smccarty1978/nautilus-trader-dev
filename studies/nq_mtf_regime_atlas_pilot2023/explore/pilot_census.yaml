# EXPLORE (THE FOUR STAGES, step 4) over the registered pilot frame.
# Registered analysis_ops ONLY. Tables the contract asks for that have no registered producer
# (grouped descriptive summary by outcome sign for T1/T5/T7/T8; session-day-clustered
# uncertainty, contract section 9) are NOT computed here -- they are reported as unsatisfied in
# the session report (gap_inventory.G5).
#
# Frame rows are 1m checkpoints; the flip (anchor) row of each regime is bars_1m == 1. Every op
# below is declared so that the anchor rows are separable by a leading precedence rule.
explore:
  id: nq_mtf_regime_atlas_pilot2023_census
  question: "T6 (1m census: flips, censored counts by reason, by direction) and T2 (time to the next 1m flip, censoring-aware) over the 2023 pilot frame"

analysis:
  steps:
    # T6 -- population census of 1m flips. The first rule sets aside every non-anchor checkpoint;
    # the remaining rules classify each FLIP by how its regime resolved. counts[] is the census;
    # by_stratum splits it by the new regime's direction.
    - id: t6_census
      op: analysis.classify.precedence
      rows: frame
      params:
        output_column: t6_class
        strata: [regime_direction]
        rules:
          - {label: checkpoint_not_anchor, when: [[bars_1m, ">", 1]]}
          - {label: flip_censored_session_end, when: [[censored, "==", true], [censor_reason, "==", SESSION_END]]}
          - {label: flip_censored_gap,         when: [[censored, "==", true], [censor_reason, "==", GAP]]}
          - {label: flip_censored_other,       when: [[censored, "==", true]]}
          - {label: flip_resolved_next_flip,   when: [[target_flip_within_horizon, "==", true]]}
          - {label: flip_unresolved_horizon,   when: []}

    # T2 -- time to resolution (next 1m flip) of every checkpoint, censoring-aware, pooled and by
    # direction. Horizons in seconds: 1, 2, 3, 5, 10, 20 bars of 1m, then 1h, 4h, 24h.
    - id: t2_time_to_resolution
      op: analysis.incidence.cumulative
      rows: t6_census
      params:
        horizons: [60, 120, 180, 300, 600, 1200, 3600, 14400, 86400]
        resolved_column: target_flip_within_horizon
        duration_column: time_to_flip_seconds
        observed_seconds_column: observed_seconds
        strata: [regime_direction, t6_class]
        duration_unit: seconds
        observed_unit: seconds

  artifacts:
    - {name: t6_census.json, source: t6_census, kind: json}
    - {name: t2_time_to_resolution.json, source: t2_time_to_resolution, kind: json}
