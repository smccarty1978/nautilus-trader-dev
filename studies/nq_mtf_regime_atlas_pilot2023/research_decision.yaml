    The other eight timeframes (5s, 30s, 3m, 5m, 15m, 30m, 1h, 4h) are recorded at T as RAW
    TRACKER STATE metadata columns (dir_<tf>, age_s_<tf>, bars_<tf>, start_ns_<tf>, atr_<tf>) from
    nine regime.dual_ema trackers with identical parameters. agrees/disagrees is the sign
    comparison dir_<tf> == dir_1m, applied at EXPLORE as a filter (a permissive frame carries the
    fields a later selection reads; WORKFLOW.md P). The registered regime feature family covers
    only 1m/5m/5s (G3) and its runtime adapters render only prior_1m/prior_5m/current_5m aliases;
    the registered feature.regime_alignment (1m vs 5m) and feature.regime_direction (5m) are
    composed where they exist.
  censoring_encoding: >
    outcome.session: TRADING_DAY with session_end: censor (OWNER AMENDMENT 01 A2). The compiled
    plan carries session {kind: calendar, session: ALL, censor_session: TRADING_DAY, dataset
    NQ_1S_V2_GLOBEX, reference_digest e577a361...}; resolution_precedence is [SESSION_END, GAP,
    BARRIER_TOUCH, HORIZON_EXPIRY] with max_gap 300s and horizon 24h as the observation bound.
  volume_block: >
    feature.relative_volume (registered) has no RuntimeProviderAdapter (G6). The OHLCV/delta
    provider is bindable, so the VOLUME block is: bar_volume (the flip bar's own volume),
    vol_sum_60s_vs_1200s_ratio (last 1m of volume vs the trailing 20m: "flip-bar volume vs prior
    N bars"), est_delta_ratio_60s. Volume and delta are ESTIMATED from bar geometry. Raw volume
    is never compared across years (single-year pilot).
  eth_rth_flag: >
    feature.session_membership / feature.session_elapsed are registered but their provider
    (GenericContextProvider) renders only ema_slope at runtime (G6). The ETH/RTH distinction of
    contract section 0 is therefore derived downstream from triggering_1s_ts_init against the
    dataset's committed sessions reference table -- a filter over the frame, never a population
    gate -- and T6's ETH vs RTH split is reported as unsatisfied by a registered analysis op.
  terminal_label: DESCRIPTIVE_ATLAS_COMPLETE (pilot scope 2023).

# ---------------------------------------------------------------------------------------------
# Predeclared fork policy (WORKFLOW.md N.4). Agents follow these instead of asking again; a
# genuine semantic choice with no policy here is still a SEMANTIC_DECISION_REQUIRED question.
# ---------------------------------------------------------------------------------------------
autonomy_decisions:
  on_capability_gap: stop_and_handoff                # write CAPABILITY_GAP_HANDOFF, end the session; never build it here
  platform_change_required: chore_branch_and_fresh_session
  deterministic_defect: auto_fix                     # fix, add a targeted test, re-run the bounded check
  calendar_reference_parity: common_interval_exact   # exact on the common calendar interval; Globex-only rows enumerated, descriptive
  frozen_parent_model: rescore_if_authenticated      # never retrain a frozen parent
  protected_period: never_expand_authority
  platform_merge: approval_required                  # contract section 13; the platform freeze after f136a469 makes every merge here an owner-approved exception

# ---------------------------------------------------------------------------------------------
# CAPABILITY GAP INVENTORY (contract section 13 -> capability worker). Swept as ONE category set,
# not one gap per freeze cycle. Evidence:
#   CAPABILITY_GAP_HANDOFF.inventory.json      -- 100 gaps, compiler blocks 1-2
#   CAPABILITY_GAP_HANDOFF.analysis_probe.json --   6 gaps, compiler block 3 (analysis / deliverables)
#   CAPABILITY_GAP_HANDOFF.md OWNER ADDENDUM   -- how both were reproduced
# The compiler short-circuits between blocks, so no single compile can report all of them; both
# probes were run at platform commit 4f37a507 and are committed alongside this file.
# ---------------------------------------------------------------------------------------------
gap_inventory:
  G0_multi_timeframe_population_fanout:
    kind: MISSING_CAPABILITY / UNSUPPORTED_COMPOSITION
    where: [context.flip_population, population.direction, population.anchor_identity, outcome.direction, outcome.atr, outcome.event, features.metadata.flip_timeframe]
    requirement: >
      Contract section 4 needs nine simultaneous candidate streams in ONE collection -- one row
      per (timeframe, regime start), each carrying that timeframe's own direction, own frozen ATR,
      own bar cadence and own terminal (its next flip). `population:` is single-anchored: one
      direction, one anchor_identity, one cadence. No registered tracker or trigger primitive fans
      out: tracker.episode.population_engine, trigger.population.established_filter,
      trigger.host.completed_bar_cadence and trigger.host.grid_cadence are all single-anchor.
    why_not_worked_around: >
      A nine-way OR in population.qualify collapses to ONE row per epoch with ONE direction, which
      loses the (timeframe, flip) identity the whole atlas is indexed by, and silently drops a
      second timeframe that flips in the same epoch. Nine separate studies cannot produce T6
      (cross-timeframe census) or T4/T5 (cross-timeframe alignment) as one deliverable.
    blocks: [Q1, Q2, Q3, Q4, Q5, T1, T2, T3, T4, T5, T6, T7, T8]
  G1_unknown_cadence_name_crashes_the_compiler:
    kind: PLATFORM_DEFECT (deterministic)
    where: research_workflow/grammar/compiler.py:746 (_resolve_population)
    evidence: >
      population.cadence: completed_flipping_timeframe raises
      ValueError("duration: 'flipping_timeframe' is not a duration like '600s' or '5m'") out of
      _tf_ns, AFTER the UNAVAILABLE_STREAM gap has already been recorded and `key` reassigned to
      the finest stream. An unrecognised completed_<name> cadence must return the typed
      UNAVAILABLE_STREAM gap, not crash the compile (and, when it crashes, no
      CAPABILITY_GAP_HANDOFF is written at all).
    repro: python scripts/research.py study compile --study <study with cadence completed_flipping_timeframe> --dry-run
    workaround_in_study_yaml: population.cadence completed_1s, annotated in place; NOT the declared science.
  G2_session_end_censoring_on_an_eth_plus_rth_census:
    kind: AMBIGUOUS_TEMPORAL_SEMANTICS (compiler classification) -- read as a capability gap here
    where: outcome.session (raised inside _resolve_streams, which short-circuits the whole compile)
    message: "session-end censoring needs a session with a close; declare outcome.session (e.g. RTH) or session_end: ignore"
    requirement: >
      Contract section 0 collects ETH and RTH both, distinguished not merged, so the censoring
      session is the GLOBEX TRADING DAY -- which NQ_1S_V2_GLOBEX does define (1636 sessions in the
      committed sessions reference table, calendar authority in PLATFORM_STATE). The grammar
      admits only RTH / ETH / ALL and refuses session_end in (censor, truncate) whenever the
      censoring session is ALL, even for a calendar dataset that has a close for it.
    why_not_worked_around: >
      outcome.session RTH would censor an 03:00 CT ETH flip at that day's 15:00 CT RTH close, and
      session_end ignore would drop contract section 6's censoring rule entirely. Both change the
      science, so neither was taken. This gap is what the committed study.yaml compiles to, and it
      is the reason CAPABILITY_GAP_HANDOFF.json lists ONE gap while the real inventory is 106.
  G3_canonical_feature_timeframe_domain_is_5s_1m_5m_only:
    kind: MISSING_CAPABILITY (feature-definition path, WORKFLOW.md E)
    where: features.instances (64 UNSUPPORTED_TIMEFRAME_PARAMETER + 10 UNSUPPORTED_FEATURE_PARAMETER_COMBINATION)
    finding: >
      Contract Appendix A1 is correct that any integer-multiple timeframe is an expressible STREAM
      and TRACKER -- and it is WRONG about the feature surface. The registered canonical feature
      definitions accept only a fixed timeframe domain:
        feature.regime_direction                  -> ['5m']            (5s, 30s, 1m, 3m, 15m, 30m, 1h, 4h all refused)
        feature.regime_alignment                  -> ['1m', '5m']      (reference_timeframe 15m and 1h refused)
        feature.regime_age_min                    -> ['1m', '5m', '5s']
        feature.regime_efficiency                 -> ['1m', '5m', '5s']
        feature.regime_mfe_atr                    -> ['1m', '5m', '5s']
        feature.regime_duration_min               -> ['1m', '5m', '5s']
        feature.regime_net_directional_move_atr   -> ['1m', '5m', '5s']
        feature.regime_range_atr                  -> ['1m', '5m', '5s']
        feature.distance_to_completed_range_high_atr / _low_atr -> ['1m', '5m', '5s']
      Additionally, context: current with bar_state: completed is an UNSUPPORTED_FEATURE_PARAMETER_
      COMBINATION for regime_mfe_atr / regime_net_directional_move_atr / regime_efficiency /
      regime_range_atr at 5s and 1m, while the same combination IS supported at 5m.
    requirement: widen the declared timeframe domain (and that parameter combination) to 30s, 3m, 15m, 30m, 1h, 4h across the regime feature family, on the golden-evidence promotion path.
    blocks: "[Q4, Q5, T3, T4, T5] and the section 7 ALIGNMENT block at 7 of 9 timeframes"
  G4_unregistered_features:
    kind: MISSING_CAPABILITY (feature-definition path, WORKFLOW.md E)
    where: features.instances (18 UNKNOWN_CANONICAL_FEATURE)
    confirms: contract Appendix A3
    missing:
      - session VWAP distance in own-timeframe ATR at T
      - side of session VWAP at T
      - session VWAP slope at T
      - ATR percentile versus a trailing 20-day window, per timeframe (9 instances)
      - session bucket label (Asia / London / NY pre / open / lunch / PM / close)
      - day of week of the trading session
      - minutes remaining to the RTH close
      - overnight gap in ATR
      - distance to the PRIOR SESSION high in ATR
      - distance to the PRIOR SESSION low in ATR
    blocks: "[T8] and the section 7 VOLATILITY CONTEXT / SESSION AND TIME / VWAP / PRIOR STATE blocks"
  G5_analysis_surface:
    kind: MISSING_CAPABILITY (analysis op; contract section 8 routes it as a typed analysis capability gap)
    where: analysis.steps[3..8].op
    evidence: CAPABILITY_GAP_HANDOFF.analysis_probe.json (6 gaps)
    confirms: contract Appendix A4
    missing:
      - >
        ONE grouped descriptive summary op: n, mean, median and declared quantiles of declared
        value columns by declared group keys, censoring-aware. Produces T1, T5, T6, T7, T8.
      - >
        ONE cluster-robust uncertainty op: standard error and confidence interval for every
        reported mean and every reported difference of means, CLUSTERED BY SESSION DAY, reporting
        the cluster count alongside the row count. Contract section 9 makes this mandatory on
        every reported number, so without it NOTHING in T1-T8 is reportable.
    already_registered_and_compiling:
      - analysis.path.anchored_offsets  -> T3 and T4 (compiled cleanly with the declared params)
      - analysis.incidence.cumulative   -> T2 (compiled cleanly with the declared params)
    blocks: "[T1, T5, T6, T7, T8] and the section 9 uncertainty on every table"

