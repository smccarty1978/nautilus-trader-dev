  G6_registered_features_without_runtime_adapters:
    kind: MISSING_CAPABILITY (runtime binding; research_workflow/provider_host.py ADAPTER_REGISTRY)
    where: features.instances
    found: session one, 2026-09-11, platform main 451836f8
    finding: >
      The compiler's binding proof (ProviderHost.verify_bindings) refuses REGISTERED, VERIFIED
      features whose canonical provider has no RuntimeProviderAdapter or whose adapter does not
      render the requested alias:
        feature.session_membership, feature.session_elapsed  -> GenericContextProvider adapter renders ema_slope only
        feature.relative_volume, feature.activity_flip_count -> GenericArrivalVolumeProvider / GenericMedianCenterCompatibilityProvider have no adapter
        feature.regime_age_min at 1m current              -> StructuralGeometryAdapter renders current_5m_regime_age_min only
        feature.regime_net_directional_move_atr at 5m current -> not a snapshot key of the structural adapter
        feature.distance_to_completed_range_*_atr at 1m   -> reference_timeframe domain is 5m only
      `research cap describe` reports all of them status: verified. The registry and the runtime
      adapter surface disagree; the compiler is the authority and the study composes only what binds.
    consequence: >
      ETH/RTH flag not carried as a feature column (derived downstream from triggering_1s_ts_init);
      relative volume vs a trailing baseline and the session flip count are not carried.
    blocks: "[T6 ETH vs RTH split] and the section 7 SESSION AND TIME / VOLUME(relative) blocks"

  G7_completed_bar_cadence_on_a_coarser_external_stream:
    kind: MISSING_CAPABILITY (runtime; research_workflow/host/mux.py assert_epoch_visibility + grammar/compiler.py stream roles)
    where: population.cadence
    found: session one smoke 2023-10-02 (2026-09-11), plan 67c7b47d, RUNTIME_FAILURE
    finding: >
      population.cadence: completed_1m compiles (RESEARCH_YAML_REFERENCE lists it) but on a
      DatasetSpec with external 1s AND 1m the compiler makes every coarser external timeframe a
      CONTEXT stream ("only the finest external timeframe carries epochs"), and the host raises the
      cadence epoch on the 1m bar itself, so mux.assert_epoch_visibility refuses it:
      CONTEXT_STREAM_VISIBLE_AT_EPOCH nq_1m visible_through T >= T. The 1s execution bar with the
      same ts_init is already visible at T, so an epoch at the completed 1m bar's own close is
      causally sound; the assertion is generic, not semantic. The compiler does not refuse the
      combination either, so the defect surfaces only at smoke.
    requirement: >
      EITHER let a completed-bar cadence stream carry its own epoch (exempt the cadence stream from
      the strictly-before rule at its own ts_init, with a targeted mux test), OR refuse
      completed_<coarser external tf> at compile with a typed gap. The scientifically required one
      is the first; the second is the minimum.
    study_side_route_taken: >
      Declare no 1s stream: 1m becomes the finest external stream (execution), epochs are the
      completed 1m bar close, 3m..4h derive as complete buckets of external 1m bars (fewer
      discarded buckets than from 1s, where any second without a trade voids the bucket). Cost:
      the feature host needs a 1s stream, so ZERO feature instances bind -- the 21 adapter-rendered
      features of plan 67c7b47d (prior-regime geometry, 1m/5m alignment, 5m current geometry,
      OHLCV volume/delta) are dropped, and 5s/30s alignment context is not derivable. Plan
      3ff96583 (session one). The frame carries tracker-state metadata for 1m and 3m..4h and the
      1m excursion path; regime_alignment 1m vs 5m is the sign comparison dir_5m == dir_1m at
      EXPLORE.
    blocks: "[section 7 features entirely for this pilot; 5s and 30s alignment context]"

