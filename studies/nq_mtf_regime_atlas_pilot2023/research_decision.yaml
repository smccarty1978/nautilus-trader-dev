terminal_decisions:
  study_class: >
    DESCRIPTIVE ORIENTATION, not falsification (contract section 0). No hypothesis, no prediction
    direction, no kill criteria. Nothing found here is a finding; any apparent edge becomes a
    hypothesis for a separate falsification study on prohibited data. model: none, and no
    economics are simulated (contract section 11).
  instrument: NQ only (contract section 0, stated assumption; ES is not collected).
  sessions: >
    ETH and RTH both, distinguished not merged. population.session: ALL; the ETH/RTH flag is
    feature.session_membership(session=RTH), never a filter.
  population: >
    Census, not a qualified population (contract section 4). NO population.qualify: no minimum
    age, no MFE floor, no retention gate. One row per regime flip, per timeframe; identity is
    (timeframe, regime start); direction is the NEW regime's direction; the decision epoch T is
    the close of the bar on which that timeframe's flip is confirmed.
  normalization: >
    PRIMARY denominator is the flip's OWN timeframe ATR at T; SECONDARY is the 1h ATR at T
    (contract section 5). Both are required. The raw ATR of all nine timeframes is recorded as
    metadata (atr_5s .. atr_4h) so both denominators are auditable.
  outcome: >
    Realized return from the flip bar CLOSE to the NEXT flip bar CLOSE on the same timeframe,
    signed by direction, in own-timeframe ATR. Bar close, not a threshold level. Encoded as
    outcome.kind: label with event: <flipping tracker>.flipped and entry_reference: decision_close.
  censoring_rule: >
    A regime still open at the session end, at a data gap, or at the chronology boundary is
    CENSORED and flagged, never treated as resolved (contract section 6). Encoded as
    session_end: censor plus max_gap: 300s. outcome.horizon: 24h is an OBSERVATION BOUND ONLY --
    it is longer than any Globex trading day, and SESSION_END precedes HORIZON_EXPIRY in the
    compiled resolution_precedence, so the session close is what censors. The horizon is NOT a
    scientific truncation of the terminal. This encoding is currently REFUSED by the compiler
    (gap_inventory.G2) and has NOT been silently traded for session_end: ignore.
  path_ordering: >
    time-to-MFE, time-to-MAE, which occurred FIRST, MFE retained at regime end (giveback ratio)
    and the MAE-before-MFE flag are FIRST-CLASS, not diagnostics (contract section 6). They are
    read off the per-bar checkpoint sequence of the running excursion columns
    (mfe_atr_<tf> / mae_atr_<tf> / pnl_atr_<tf> / retained_<tf>), which is causal at every
    checkpoint; they are NOT reconstructed from a terminal-only summary.
  path_offsets: >
    MFE and MAE in ATR at offsets 1, 2, 3, 5, 10, 20 bars OF THE FLIPPING TIMEFRAME plus terminal
    (next flip), via analysis.path.anchored_offsets over the per-bar checkpoint rows. The
    per-timeframe checkpoint cadence is part of gap_inventory.G1; population.cadence:
    completed_1s in study.yaml is a compile placeholder, NOT the declared science, and must not
    survive into a sealed study.
  chronology: >
    EXPLORE 2023 only. 2026 PROHIBITED -- not collected, not read, not summarized.
    2020 / 2021 / 2022 / 2024 / 2025 are NOT declared prohibited: they are simply not partitions
    of this pilot. Declaring 2022 prohibited would conflict with
    chronology.warmup.days_before_partition (5 calendar days of lead-in immediately before
    2023-01-01 fall in 2022), and the pilot does not change those years' authority for the
    six-year study nq_mtf_regime_atlas.
  statistics: >
    Overlapping regimes across nine timeframes are NOT independent observations (contract
    section 9). Every mean or difference reported must carry an uncertainty estimate CLUSTERED BY
    SESSION DAY, with the cluster count reported alongside the row count. This is mandatory, not
    optional, and no registered analysis op provides it (gap_inventory.G5).
