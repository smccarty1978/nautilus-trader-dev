# Not asked of the owner (contract section 14 forbids it): capability details, implementation
# defects, merge mechanics. Every item above is a capability route, not a scientific question.
# No SCIENTIFIC_SEMANTIC_DECISION_REQUIRED was reached: every semantic choice this design needed
