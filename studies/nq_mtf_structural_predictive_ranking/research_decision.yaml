# Phase B RESULT (2026-09-23, session a2b50fd4). Target A only. Report: REPORT_TARGET_A.md
verdict:
  code: NO_INFORMATION
  target: "A_win = terminal_gross_pnl_atr > 0"
  answer: >-
    NO. The 78-variable T0 MTF + structural-geometry model, trained on 2023 only and applied once to 2024 under
    boundaries frozen beforehand, scored ROC AUC 0.5137 (day-blocked bootstrap 95% CI [0.4996, 0.5284] -- contains
    chance) and produced no monotonic economic concentration (Spearman decile vs mean terminal gross ATR = -0.33).
    It beat none of the three controls; every paired AUC delta straddles zero. The same model scores 0.9783 on the
    rows it was fitted on: the surface memorises a year and transfers nothing.
  evidence:
    oos_2024_auc: {full: 0.5137, geometry_no_direction: 0.5112, direction_only: 0.5168, mtf_state_only: 0.5208}
    dev_2023_auc_in_sample: {full: 0.9783, geometry_no_direction: 0.9728, direction_only: 0.5263, mtf_state_only: 0.5376}
    full_vs_controls_auc_delta_ci95:
      direction_only_minus_full: [-0.0152, 0.0206]
      geometry_no_direction_minus_full: [-0.0121, 0.0073]
      mtf_state_only_minus_full: [-0.0124, 0.0261]
    pooled_2024: {eligible_n: 7047, win_pct: 33.74, mean_gross_atr: 0.042, median_gross_atr: -0.703, session_days: 258}
    full_top10_2024: {n: 81, coverage_pct: 1.1, win_pct: 33.3, lift_pp: -0.4, lift_ci95: [-10.8, 11.3]}
  only_nominal_positive: >-
    direction_only top-k win lift +1.5pp [+0.3, +2.7] -- the ONE-BIT CONTROL, one of twenty nominal comparisons,
    survives no multiplicity adjustment, and is not the hypothesis. Not evidence.
  consistent_prior_finding: >-
    The single consistent gradient is +2A REACH (full D10 43.2% vs 38.3% pooled; geometry D10 45.2%), which does not
    convert into mean gross ATR, and both EXTREME deciles show elevated mean ATR. Extreme scores mark higher VARIANCE,
    not better trades -- the atlas's "predicts spread, not drift", now reproduced out of sample.
  method_limitations:
    - "2023 development AUCs are IN-SAMPLE (one tuning year, no within-2023 holdout). They measure memorisation and
       selected nothing. Any future run on this surface must carve a within-2023 holdout."
    - "2024 was protected by the FREEZE RECEIPT, not the chronology gate: both years are reused train:-role partitions
       (chronology.oos is empty), so the governed analyze stage cannot run (ExperimentAuthorizationError: chronology
       must declare non-empty train and OOS years) and the study halts at READY_TO_ANALYZE. Declaring 2024 as oos:
       would change authorised year roles, break re-attestation and force a replay of both years. Not done."
    - "All figures gross; no costs applied."
  targets_b_to_e: >-
    DO NOT launch as a batch. Same rows, same surface, high prior of null, and four more targets against an
    already-opened evaluation year compounds the multiplicity problem. If one probe is judged worthwhile, a single
    pre-registered reach-based target (+2A before terminal flip) with a within-2023 holdout is the defensible choice.
  models_verified:
    full: 3cf8c5493fef66a7c1b5c04468b0e717eef8247626bfa7dc3ff65109f28ed973
    geometry_no_direction: 410e6146680484b6e1b5a1bc039ee670b7bf07c2ae5da68cb80a895dc37bd6e3
    mtf_state_only: 48e72fc1509d6547437d4026267319fc6adb9a1dcd7c6348460f9768a7e172ab
    direction_only: 042c613e66214a549fd951910242eeb6903d647e70e17fcab8ee3051d9c67976
    check: "all four authenticate; golden max_abs_diff 0.0; canonical bytes match; train_years [2023]; feature-order SHAs match the freeze"
  freeze_sha256: 357302cbc632f504dbf4acafa4877c88bb65aafef4f7be878d9ab955eedd28cd
  untouched: [2025, 2026]

