capability_gap_model_feature_columns:
  status: RESOLVED   # main ff47868d; the declaration is replay-neutral as proved
blockers_found_pre_fit:
  evidence: artifacts/reuse_and_target_blockers.json
  B1_replay_closure_moved:
    finding: >-
      replay_plan_sha256 of this study == the atlas's d917443a (PASS: model.feature_columns, arms and cells are
      replay-neutral), but the replay-stage CLOSURE COMPOSITE differs (2e30c4f7 vs the partitions' 16aa9039), so
      both audited partitions would be RE-REPLAYED. Collection was NOT launched (owner hard stop).
    root_cause: >-
      research_workflow/grammar/spec.py is INSIDE the replay-stage closure because
      features/trackers/host_bindings.py imports duration_seconds from it (lines 172, 269), and the closure is
      file-level. The model_feature_columns capability added ModelSpec.feature_columns to that same file, so
      merging the capability moved the composite. lifecycle_v2.py and grammar/compiler.py are NOT in the closure.
    honest_note: >-
      the capability's acceptance proof compared compiles at ONE code version; it never checked that MERGING the
      capability preserves the recorded partitions' closure composite. That check was missing.
    options:
      A_recollect_once: "~2 h P-core (2023 57 min + 2024 57 min) under the new closure; governance intact; owner forbade recollection"
      B_platform_chore: >-
        move the replay-time helpers (duration_seconds) out of spec.py into a schema-free module so a grammar edit
        never touches the replay path. NOTE: this ALSO changes the closure file list, so it does not by itself make
        the EXISTING partitions reusable -- it only prevents the next occurrence.
      C_closure_migration: "a governed re-attestation of an existing partition under a new closure (does not exist today)"
    owner_decision_required: true
  B2_no_trainable_binary_label:
    finding: >-
      the audited frame has no trainable binary label. target_flip_within_horizon is single-class (65,290 ones,
      196,707 censored NaN, ZERO zeros) and the 16 one-sided milestone arm labels are degenerate
      (fp_fav_2p00_label 201,284 ones vs 57 zeros). lifecycle_v2.fit takes its label from plan.outcome.label_column,
      which is inside the replay key and cannot change without re-collection.
    consequence: >-
      every frozen target (A terminal g > 0; B/C/D reach +2/+3/+5A before the terminal flip; E reach -2A) is DERIVED
      from outcome columns, and the fit stage cannot derive a label. Run as-is, fit would keep 65,290 all-positive
      rows, skip every cell on nunique()<2 and write ZERO models silently -- a vacuous fit, not an error.
    smallest_fix: >-
      declare the model target as a bounded expression over already-collected outcome columns, reusing the registered
      analysis.derive.columns grammar (research/analysis/expressions.py), e.g. model.targets: [{id, expr}]; plus make
      a zero-model fit a hard error instead of a silent PASS.
    independent_of_B1: true

