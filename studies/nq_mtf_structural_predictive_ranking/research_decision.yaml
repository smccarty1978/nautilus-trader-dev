# Phase B FORENSIC AUDIT (2026-09-23, session a2b50fd4). Read-only. Report: forensics/TARGET_A_FORENSIC_AUDIT.md
forensic_audit:
  verdict: PIPELINE_CORRECT_OVERFIT_CONFIRMED
  verdict_sha256: 402b3ac2d57d5e3a146529b823d412225d374bdfb96edef05a22966683ccc4bf
  question: "is 0.9783 -> 0.5137 a real research result or a broken experiment?"
  answer: >-
    REAL. The pipeline is correct and the NO_INFORMATION verdict stands, better supported than before. The
    cause is memorisation, not domain shift.
  parity:   # every check exact, not within tolerance
    population: "0 duplicate keys either year; identical filter rule; 7475/7047 match the fit and scoring receipts"
    target: "0 mismatches and 0 null differences over 261,997 rows vs an independent pandas derivation"
    feature_order_and_semantics: "golden fit-time matrix rebuilt independently, max_abs_diff 0.0, NaN pattern and column order identical, all 4 arms"
    predictions: "model_store.score vs raw lightgbm Booster from canonical bytes: max_abs_diff 0.0, both years, all 4 arms"
    auc: "0.9783 and 0.5137 reproduced by platform metric, hand-rolled Mann-Whitney and sklearn"
  discriminators:
    random_label_train_auc: 0.9711    # seed 20260923; real-label train AUC 0.9783 -> in-sample AUC measures capacity only
    chronological_2023_holdout: {split_date_ct: '2023-09-11', train_n: 5231, holdout_n: 2244,
                                 full_train_auc: 0.9899, full_holdout_auc: 0.5169, frozen_2024_auc: 0.5137}
    controls_holdout_auc: {direction_only: 0.5091, mtf_state_only: 0.4985}   # price-free, no capacity: nothing is masked
    case_3_temporal_shift: CONTRADICTED   # holdout collapses at ~25% price extrapolation vs ~95% for 2024
  defects_found_not_invalidating:
    NON_STATIONARY_PRICE_FEATURES: >-
      22 of 78 features are ABSOLUTE PRICE LEVELS (start_price_*, highest_high_*, lowest_low_*, prior_start_price_*,
      prior_end_price_*, prior_mfe_price_*, prior_mae_price_*). 94.8-96.0% of 2024 rows fall outside the ENTIRE 2023
      range of each (NQ ~10,750-17,165 in 2023 vs ~16,334-22,152 in 2024). Within 2023 they are near-unique
      memorisation handles; in 2024 they are pure extrapolation (score sd ratio 0.616). A design defect in the
      declared feature surface -- but NOT the cause of the null, per the within-2023 holdout.
    INERT_ROW_SUBSAMPLING: >-
      subsample 0.8 never applied: LightGBM bags only when subsample_freq > 0, which is unset. One of two declared
      regularisers did nothing. Recorded, NOT fixed (fixing it would be tuning).
    CONSTANT_FEATURES_2023: "checkpoint_seconds_since_flip and bars_1m are constant across all 2023 training rows"
  capacity: {trees: 400, total_leaves: 12400, training_rows: 7475, training_rows_per_leaf: 0.603,
             early_stopping: none, lightgbm: 4.6.0}
  caveat_added_to_the_conclusion: >-
    The experiment did not cleanly TEST the research question: it ran at a capacity that fits noise to 0.97 over a
    surface containing 22 non-stationary absolute price columns. NO_INFORMATION is the correct verdict for THIS
    model on THIS surface; a re-specified run (price levels removed or ATR-normalised, capacity matched to the
    sample, subsample_freq set, within-2023 holdout carried) is untested and was deliberately NOT performed.
  stop_condition_triggered: false
  scope: "read-only; no frozen artifact modified, no frozen model refitted, no tuning, no feature search, Targets B-E not opened, 2025/2026 untouched"
