  P2: SIGNAL_EXISTS_BUT_IS_DIRECTION_SPECIFIC
  P3: SIGNAL_CONCENTRATED_IN_A_FEATURE_FAMILY
  P4: CLASSIFICATION_SIGNAL_BUT_POOR_ECONOMIC_PATH
  P5: NO_MEANINGFUL_SIGNAL
  ABORT: CAUSAL_POPULATION_CHRONOLOGY_DATA_FEATURE_GOVERNANCE_OR_TARGET_CONTRACT_FAILURE

