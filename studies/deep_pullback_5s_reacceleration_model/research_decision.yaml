primary_comparison: >-
  Direction-first discrimination and economic path quality of the frozen broad motivated
  feature model versus the unconditional eligible-candidate base rate, with governed family
  ablations only after clean signal exists.

terminal_question: >-
  Is there stable, economically coherent learnable continuation signal at the first completed
  5s re-alignment after a deep pullback, or should this research branch close?

