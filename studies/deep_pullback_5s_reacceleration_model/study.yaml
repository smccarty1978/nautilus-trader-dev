study:
  id: deep_pullback_5s_reacceleration_model
  type: flip_prediction
  risk_tier: 2
  description: Within an established prevailing 1m regime, after a direction-normalized
    pullback of at least 1.00 ATR and a completed causal 5s regime flip back into
    alignment with that prevailing regime, can causal market state, pullback geometry,
    volume/delta, structural-regime context, and the frozen upstream Model C context
    identify entries that reach +1.00 ATR favorable before -0.75 ATR adverse within
    300 seconds?
operation:
  kind: train_evaluate
instrument:
  symbol: NQ
  venue: XCME
population:
  type: regime_state
  session: RTH
  episode_lifecycle:
    arm_condition:
      kind: directional_adverse_excursion
      threshold_atr: 1.0
      price_source: completed_1s_intrabar
    required_event:
      kind: direction_relation
      source: generic_completed_5s_regime_state
      bar_state: completed
      availability_timestamp: completed_source_bar_ts_init
      relation: opposite_prevailing
      active_at_arm_counts: true
    emit_condition:
      kind: direction_transition
      source: generic_completed_5s_regime_state
      bar_state: completed
      availability_timestamp: completed_source_bar_ts_init
      from_relation: opposite_prevailing
      to_relation: aligned_prevailing
      strictly_after_arm: true
    rearm_on:
    - new_favorable_extreme
    terminate_on:
    - prevailing_regime_flip
    max_candidates_per_episode: 1
target:
  type: composite
  conditions:
  - id: ordered_continuation
    kind: ordered_barrier
    forward_outcome_id: ordered_continuation_1p00_vs_0p75_300s
    barrier_id: ordered_continuation_1p00_vs_0p75_300s
  required_forward_outcomes:
  - id: ordered_continuation_1p00_vs_0p75_300s
    entry_reference: next_bar_open
    horizon_seconds: 300
    max_tracking_seconds: 300
    excursion_units:
    - atr
    bar_inclusion: fully_forward
    session_end_censoring: true
    max_gap_seconds: 1
    atr_source: latest_causally_completed_1m_wilder_atr_14_available_at_T
    atr_frozen_at: decision_ts
    ordered_barriers:
    - id: ordered_continuation_1p00_vs_0p75_300s
      favorable_atr: 1.0
      adverse_atr: 0.75
      horizon_seconds: 300
  decision_reference: decision_ts
