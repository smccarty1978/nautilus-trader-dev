# Authoritative decision contract (research_decision.yaml > SPEC.md > study.yaml > compiled_study.json > code)
study_id: nq_fair_pricing_reversion
research_question: "Does NQ exhibit a statistically meaningful tendency to revisit its regular-session opening price following intraday displacement, and do displacement-candle or confirmed BOS entries improve subsequent reversion outcomes?"
status: DRAFT
dataset_id: NQ_1S_V2_GLOBEX

hypotheses:
  H1_anchor_reversion: "The probability and timing of a return to the regular-session opening price vary systematically with displacement distance, elapsed session time, and intraday market conditions."
  H2_displacement_confirmation: "A qualifying opposite-direction displacement candle identifies subsequent favorable reversion behavior beyond that observed for comparable displaced-price checkpoints without the signal."
  H3_bos_confirmation: "A confirmed 3-bar swing break provides incremental predictive information relative to displacement-candle entries."
  H4_trend_day_failure: "Persistent directional sessions exhibit materially lower anchor-return probabilities and greater adverse excursions than balanced sessions (evaluated via causal state observable at decision time, without retrospective trend classification)."

scientific_decisions:
  anchor_definition:
    kind: time_defined_rth_open
    source: "09:30 America/New_York regular-session opening price (open of the first completed 1m bar at or after 09:30 ET)."
    time_zone_authority: "CME Globex Equity calendar schedule, timezone-aware America/New_York (never hardcoded UTC-5)."
    earliest_availability: "Available at 09:31:00 ET upon completion of the opening 1m bar (ts_init = 09:31:00 ET)."
    invariance: "Remains strictly constant throughout the session window."

  session_boundaries:
    calendar: "CME Globex Equity (CME equity index product schedule)."
    standard_rth_hours: "08:30:00 to 15:15:00 America/Chicago (09:30:00 to 16:15:00 America/New_York)."
    holiday_shortened: "Session close or halt truncates the window; out-of-calendar days fail closed."

  observation_window:
    start_instant: "09:31:00 America/New_York (first bar carrying causal anchor availability)."
    cutoff_instant: "11:00:00 America/New_York (the completed 1m bar closing exactly at 11:00:00 ET is INCLUDED; no candidate emitted with ts_init > 11:00:00 ET)."
    elapsed_seconds: "elapsed_seconds <= 5400s from 09:30 ET open."

  direction_and_eligibility:
    displacement_calculation: "displacement = close_T - anchor_T"
    displacement_direction: "sign(displacement) -> +1 if close_T > anchor_T, -1 if close_T < anchor_T"
    recovery_direction: "-displacement_direction -> -1 (short reversion) if displaced above anchor; +1 (long reversion) if displaced below anchor."
    regime_role: "regime_1m.dir is preserved strictly as causal context, never used as recovery direction."
    zero_displacement_policy: "Observations where close_T == anchor_T (displacement == 0) are strictly INELIGIBLE for recovery tracking."

  population_identity:
    primary_census: "All eligible 1-minute checkpoints within 09:31-11:00 ET with |displacement| >= threshold."
    episode_first: "Earliest qualifying displacement checkpoint per excursion episode away from anchor."
    reporting_strata: [20.0, 40.0, 60.0, 80.0]  # NQ points (predetermined descriptive reporting strata, not optimized gates)
    atr_reporting_strata: [1.0, 1.5, 2.0]        # 1m ATR(14) units

  forward_horizon_and_censoring:
    forward_observation_end: "The earlier of the per-session RTH calendar close (15:15 CT / 16:15 ET or early holiday close) or declared horizon."
    candidate_emission_vs_outcome: "Candidate emission stops at 11:00 ET; forward outcome tracking continues through RTH close."
    independent_milestones: [0.25, 0.50, 0.75, 1.00]
    milestone_censoring_policy: "Independent resolution per milestone. An unresolved milestone at session close is CENSORED SESSION_END, never recorded as a failure or loss."
    gap_censoring_seconds: 60.0

  recovery_calculation_precision:
    frozen_at_T:
      - anchor_T
      - close_T
      - displacement_direction
      - abs_displacement_T
      - recovery_prices: [P_25, P_50, P_75, P_100]
    denominator_invariance: "abs_displacement_T remains immutable; future extrema never redefine the denominator."
    touch_definition: "Exact market price touch or crossing of completed bar extremes without artificial tolerance (low <= target for short, high >= target for long)."
    tick_size: 0.25

admissible_chronology:
  train_partitions: [2021, 2022, 2023]
  dev_reserved: [2024]
  prohibited_reserved: [2025, 2026]
  smoke_date: "2023-10-02"

terminal_decisions: {}

autonomy_decisions:
  on_capability_gap: stop_and_handoff
  platform_change_required: chore_branch_and_fresh_session
  deterministic_defect: auto_fix
  calendar_reference_parity: common_interval_exact
  frozen_parent_model: rescore_if_authenticated
  protected_period: never_expand_authority
