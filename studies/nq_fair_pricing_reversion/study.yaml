# Platform-v2 study: NQ Fair Pricing Theory — Anchor Reversion and Entry Confirmation
study:
  id: nq_fair_pricing_reversion
  tier: 2
  question: "Does NQ exhibit a statistically meaningful tendency to revisit its regular-session opening price following intraday displacement, and do displacement-candle or confirmed BOS entries improve subsequent reversion outcomes?"

streams:
  - {dataset: NQ_1S_V2_GLOBEX, timeframes: [1s, 1m]}

context:
  regime_1m:       {tracker: regime.dual_ema, timeframe: 1m}
  excursion:       {tracker: regime.excursion, bars: 1s, regime: regime_1m}
  regime_bar_5m:   {tracker: regime_bar.calendar_bucket, bucket: 5m, bars: 1m, regime: regime_1m}
  displacement_1m: {tracker: candle.displacement_1m, bars: 1m}
  bos_1m:          {tracker: structure.bos_1m, bars: 1m}

population:
  session: RTH
  cadence: completed_1m
  qualify: "features.rth_open_elapsed_seconds <= 5400 and features.rth_recovery_direction != 0"
  direction: features.rth_recovery_direction

triggers: every_candidate

features:
  instances:
    - {feature: distance_to_level, level: rth_open, level_context: session, normalization: points, timeframe: 1m}
  metadata:
    is_displacement: "displacement_1m.is_displacement"
    displacement_dir: "displacement_1m.displacement_dir"
    displacement_toward_anchor: "displacement_1m.toward_anchor"
    displacement_signal: "displacement_1m.signal"
    is_bos: "bos_1m.is_bos"
    bos_dir: "bos_1m.bos_dir"
    bos_toward_anchor: "bos_1m.toward_anchor"
    bos_signal: "bos_1m.signal"

outcome:
  kind: label
  reference: features.rth_open
  entry_reference: next_bar_open
  entry_cutoff: "11:00:00 America/New_York"
  session_cutoff: "11:30:00 America/New_York"
  session_end: truncate
  horizon_end_rule: strict
  horizon: 5400s
  max_gap: 60s
  barrier:
    primary: tp38_sl25
    arms:
      - {id: m25, unit: recovery, favorable_atr: 0.25}
      - {id: m50, unit: recovery, favorable_atr: 0.50}
      - {id: m75, unit: recovery, favorable_atr: 0.75}
      - {id: m100, unit: recovery, favorable_atr: 1.00}
      - {id: tp38_sl25, unit: points, favorable_points: 38.0, adverse_points: 25.0}
      - {id: anchor_sl25, unit: reference, adverse_points: 25.0}

chronology:
  train: [2021, 2022, 2023]
  dev: [2024]
  prohibited: [2025, 2026]
  authorized_dates: ['2023-10-02']

model: none
