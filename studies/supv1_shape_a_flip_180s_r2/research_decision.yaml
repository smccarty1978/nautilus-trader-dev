# Authoritative decision contract (research_decision.yaml > SPEC.md > study.yaml > compiled_study.json > code)
study_id: supv1_shape_a_flip_180s_r2
research_question: "Supervisor V1 final clean validation: rerun of the closed reference study v2_shape_a_flip_180s.\nThis is an infrastructure audit, not new research. Design worker instructions:\n1. Copy studies/v2_shape_a_flip_180s/study.yaml from this worktree VERBATIM into\n   studies/supv1_shape_a_flip_180s_r2/study.yaml, changing ONLY `id:` to supv1_shape_a_flip_180s_r2.\n   Do not add, remove, reorder or re-parameterize any feature, tracker, chronology or model field.\n2. In research_decision.yaml keep status DRAFT, set dataset_id NQ_1S_V2, research_question to this text, and declare:\n   terminal_decisions:\n     SUPERVISOR_V1_VALIDATED_END_TO_END: the supervisor drove the full lifecycle and the rerun reconciles with the reference within explained platform drift\n     SUPERVISOR_V1_NOT_VALIDATED: the supervisor or the rerun failed a control-plane or research-plane gate\n   `terminal_decisions` is the closure VOCABULARY the analysis decision must come from (research_workflow.study_closure); it is never metadata.\n   Keep the default autonomy_decisions and ADD `platform_merge: approval_required` under autonomy_decisions\n   (a capability merge to main needs human approval; none is expected). Do NOT add closed_study_merge.\n3. Run `python scripts/research.py study compile --study studies/supv1_shape_a_flip_180s_r2` and commit\n   study.yaml, research_decision.yaml and compiled_plan.json on the study branch. If compile returns any\n   CapabilityGap, do NOT resolve it: commit the handoff and stop BLOCKED (that is an audit finding).\nAnalysis worker instructions (phase D): compare artifacts/experiment_analysis_v2.json with the reference study's\n(studies/v2_shape_a_flip_180s/artifacts/experiment_analysis_v2.json in this worktree) and with the previous\nsupervised rerun (studies/supv1_shape_a_flip_180s on branch study/supv1_shape_a_flip_180s, if visible);\nterminal_decision MUST be one of the two declared labels above."
status: DRAFT
dataset_id: NQ_1S_V2
terminal_decisions:
  SUPERVISOR_V1_VALIDATED_END_TO_END: the supervisor drove the full lifecycle and the rerun reconciles with the reference within explained platform drift
  SUPERVISOR_V1_NOT_VALIDATED: the supervisor or the rerun failed a control-plane or research-plane gate
# Predeclared fork policy (WORKFLOW.md §N.4). Agents follow these instead of asking again; a genuine
# semantic choice with no policy here is still a SEMANTIC_DECISION_REQUIRED question.
autonomy_decisions:
  on_capability_gap: stop_and_handoff                # write CAPABILITY_GAP_HANDOFF, end the session; never build it here
  platform_change_required: chore_branch_and_fresh_session
  deterministic_defect: auto_fix                     # fix, add a targeted test, re-run the bounded check
  calendar_reference_parity: common_interval_exact   # exact on the common calendar interval; Globex-only rows enumerated, descriptive
  frozen_parent_model: rescore_if_authenticated      # never retrain a frozen parent
  protected_period: never_expand_authority
  platform_merge: approval_required            # a capability merge to main needs human approval
