study:
  id: Codex_clean_maturity_flip_rolling_5m_productivity
  type: flip_prediction
  risk_tier: 2
  description: Clean maturity-conditioned prevailing-1m flip prediction with structural and rolling 5m productivity ablations.
operation:
  kind: train_evaluate
  target_metric: roc_auc
instrument:
  symbol: NQ
  venue: XCME
population:
  type: regime_state
  prevailing_regime: both
  session: RTH
  qualification:
    age_gate_seconds: 120
    running_mfe_atr_gte: 1.0
    new_progress_windows_gte: 2
    retained_mfe_ratio_gte: 0.5
    cadence_seconds: 5
    established: true
target:
  type: flip
  event: prevailing_1m_regime_transition
  direction: both
  horizon_seconds: 300
  confirmation:
    mode: completed_1m_bar
    confirmation_bars: 1
features:
  source: canonical_verified_definition_universe
  metadata_columns:
    - observation_ts
    - regime_start_ns
    - checkpoint_index
    - regime_age_seconds
    - running_mfe_atr
    - new_progress_windows
    - retained_mfe_ratio
  instances:
