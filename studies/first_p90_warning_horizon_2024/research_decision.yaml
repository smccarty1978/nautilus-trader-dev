  in each full-2024 RTH regime, descriptively and without any model selection?
baseline: {short: frozen_parent_score_path, long: frozen_parent_score_path}
baseline_feature_selection: {mode: none}
model_arms: {LONG: frozen_parent_long, SHORT: frozen_parent_short}
variable_being_tested: [first_inclusive_frozen_p90_warning_followup]
prohibited_changes:
