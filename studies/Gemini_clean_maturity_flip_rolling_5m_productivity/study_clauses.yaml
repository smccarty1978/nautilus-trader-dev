# Structured Mandatory Research Design Clauses for Gemini_clean_maturity_flip_rolling_5m_productivity
# Canonical machine-readable specification derived from SPEC.md and research_decision.yaml

study_id: Gemini_clean_maturity_flip_rolling_5m_productivity

required_clauses:
  train_partition_years:
    target: "chronology.train"
    expected: [2021, 2022, 2023]
    description: "TRAIN restricted to 2021-2023"

  dev_partition_years:
    target: "chronology.dev"
    expected: [2024]
    description: "DEV / OOS restricted to 2024"

  prohibited_years_sealed:
    target: "chronology.prohibited"
    contains: [2025, 2026]
    description: "2025 and 2026 sealed or prohibited from training/selection"

  warmup_authorization:
    target: "chronology.warmup.allowed"
    expected: true
    description: "Warmup data loading explicitly authorized"

  model_arms:
    target: "model.arms"
    expected: ["BASELINE_A", "STRUCTURAL_B", "ROLLING_PRODUCTIVITY_C"]
    description: "Three model feature blocks (A: Top-25, B: Structural, C: Rolling Productivity)"

  primary_maturity_buckets:
    target: "stratification.buckets"
    expected: [[300, 600], [600, 900], [900, 1800]]
    description: "Three primary maturity buckets: 300-600s, 600-900s, 900-1800s"

  clean_lineage_reset:
    target: "lineage.clean_lineage_start"
    must_be_non_empty: true
    description: "Clean lineage boundary declared with invalidated dry-run quarantine ledger"

  feature_count_total:
    target: "features.feature_list"
    length_expected: 60
    description: "Total feature universe exactly equals 60 features"
