# --------------------------------------------------------------------------------------------
# Accepted technical debt (owner decision 2026-09-20): does not block research.
# --------------------------------------------------------------------------------------------
technical_debt:
  one_sided_barrier_encoding:
    what: >
      BarrierArm requires both a favorable and an adverse level and there is no native one-sided
      first-passage item, so each of the 16 milestone arms parks its unused side at 99.0 ATR.
    accepted_because: >
      fixtures/first_passage_parity.py case parked_side_never_fires proves the parked side never
      resolves, and every arm's first-passage second matches an independent oracle exactly.
    future_fix: a native one-sided first-passage outcome item; not required by this study.

# --------------------------------------------------------------------------------------------
# TWO-YEAR REPLICATION PROTOCOL (owner directive 2026-09-21). Binding on every later session.
# --------------------------------------------------------------------------------------------
two_year_replication_protocol:
  why_both_years_are_train_partitions: >
    This study fits nothing (model: none), so the `oos` stage's door -- which requires a TRAIN
    freeze -- cannot be opened without manufacturing a dummy model and a fake freeze. The owner
    explicitly forbade that. Collecting both years as TRAIN partitions is the least invasive
    existing configuration that needs no platform development, and the controller preserves
    per-year partition identity at _work/controller/partitions/train/<year>/ so the years remain
    separable in every downstream artifact.
  year_roles:
    2023: DISCOVERY -- descriptive atlas construction. Every cohort definition, lifecycle class,
          transformation, statistic, table and atlas view is specified here.
    2024: FROZEN TEMPORAL REPLICATION -- the sealed 2023 specification applied UNCHANGED.
  call_by_call_year_table:
    - {call: "collection (train partition 2023)", year: 2023, role: DISCOVERY, reads: 2023}
    - {call: "collection (train partition 2024)", year: 2024, role: REPLICATION, reads: 2024}
    - {call: "merge", years: [2023, 2024], note: "per-year partition identity preserved in identity.json"}
    - {call: "atlas construction", year: 2023, role: DISCOVERY, reads: 2023 ONLY}
    - {call: "replication readout", year: 2024, role: REPLICATION, reads: 2024, precondition: "the 2023 atlas specification is frozen and committed first"}
  binding_obligations:
    - All cohort definitions, lifecycle classes, transformations, statistics, tables and atlas
      views used to judge stability MUST be specified and committed BEFORE any 2024 result is
      inspected. The commit that freezes them is the audit trail.
    - No classifier, no entry model, no feature selection, no threshold fitting, no 2024-driven
      redesign, at any point in this study.
    - Any exploratory finding made after looking at 2024 is labelled EXPLORATORY and CANNOT
      retroactively alter the sealed 2023 -> 2024 replication verdict.
    - The years are NOT pooled until the year-by-year stability result is visible.
  residual_risk_stated_plainly: >
    A chronology gate is not enforcing this; a contract obligation is. The mitigation is that
    nothing is fitted, so there is no parameter, threshold or selected feature that 2024 could
    leak into -- the only thing at risk is the honesty of the replication claim, which the
    freeze-before-inspect commit rule is designed to protect.

lifecycle_outcome_policy_v3:
  changed: population.session stays RTH; outcome.session RTH -> TRADING_DAY
  why: >
    Causal audit pass_01 WARNING C-1: RTH-close censoring truncates any lifecycle whose opposite
    1m flip lands after 15:15 CT, which selects against exactly the long-runner cohort this study
    exists to describe. RTH still defines who is a candidate and when the fixed-time checkpoints
    fire; once a qualifying RTH flip exists its lifecycle now runs to the natural opposite flip
    across the session boundary, bounded by the Globex trading day.
  session_end: truncate (unchanged -- the trading-day close ends the window rather than voiding it)

