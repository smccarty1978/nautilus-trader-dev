# Authoritative decision contract (research_decision.yaml > SPEC.md > study.yaml > compiled_study.json > code)
study_id: nq_va_multitf_trade_state_geometry
research_question: >
  How do canonical confirmed 1-minute V_A flip-to-flip trades evolve through quick failure,
  slow/grinding deterioration, and large trend-runner states when viewed jointly with
  5m / 15m / 1h regime state, higher-timeframe regime geometry, normalized structural levels,
  and fixed-time path information? The purpose is to decide whether the data supports separate
  ensemble heads for (1) initial risk, (2) trend health / giveback, (3) runner preservation.
status: BLOCKED_PENDING_C1_REPAIR
phase: A
dataset_id: NQ_1S_V2_GLOBEX
source_platform_commit: d83be2fd00c351fdf187bf4451d2efa123e9f664

# --------------------------------------------------------------------------------------------
# Chronology (spec §1). 2025 is SEALED and 2026 is PROHIBITED; neither is opened by this study.
# --------------------------------------------------------------------------------------------
chronology_roles:
  train: [2023]            # discovery / descriptive analysis
  dev: [2024]              # frozen validation; bucket boundaries defined on 2023 apply UNCHANGED
  prohibited: [2025, 2026]
  note: >
    2024 is a dev year and is opened only by the oos stage after the TRAIN freeze. Spec §26
    requires 2023-defined descriptive bucket boundaries to be applied unchanged to 2024; that is
    the oos pattern and is compatible with the role assignment. No tuning on 2024 (§1).

# --------------------------------------------------------------------------------------------
# Semantic decisions taken in Phase A. Each one is a choice, not a default.
# --------------------------------------------------------------------------------------------
terminal_decisions:

  session_scope:
    decision: population.session = RTH
    rationale: >
      The spec does not name a session. RTH is the canonical emission scope of every prior V_A
      flip-to-flip study in this lineage, so RTH keeps this population comparable with them.
    reversible: true
    flagged_to_user: true

  fixed_time_grid:
    decision: "population.cadence = {every: 15s, anchor: regime_1m.start_ns, max_age: 300s}"
    rationale: >
      Spec §5 requires observations at T0/T15/T30/T60/T120/T300. 15s is the coarsest grid whose
      multiples contain all six, so the grid emits them as a superset (21 checkpoints/trade).
      Observation entry is NOT conditioned on reaching any pullback depth (§5, and the H050
      depth-audit finding that triggering on depth destroys depth's predictive variation).
    reversible: true

  atr_coordinate_system:
    decision: atr_entry_1m = excursion.frozen_atr, frozen at the confirmed 1m flip; atr_availability = through_decision_ts
    rationale: spec §7. A coarser bar closing exactly at T is applied before the ATR is frozen.

  entry_fill:
    decision: outcome.entry_reference = next_bar_open (executable)
    rationale: >
      Spec §3. entry.next_bar_open is the only executable reference verified for both the label
      and trade contracts. entry.decision_close is a research mark and is explicitly NOT used --
      that is the defect the H050 audit found in scripts/run_delayed_entry_fast_failure_study.py.

# --------------------------------------------------------------------------------------------
# CORRECTION (2026-09-20, same session). An earlier revision of this file recorded the study as
# BLOCKED_ON_CAPABILITY_GAP with 51 gaps and claimed "15m and 1h do not exist". That was WRONG
# and is retracted. What is true:
#   * the regime TRACKER (regime.dual_ema) is expressible at ANY integer-multiple timeframe, and
#     the host derives the completed calendar buckets. studies/nq_mtf_regime_atlas_pilot2023
#     collected 9 timeframes (5s..4h) on this exact platform commit and produced 390 1h regimes.
#   * only the canonical regime FEATURE family is limited to 5s/1m/5m. That is gap G3, catalogued
#     in that study's research_decision.yaml on 2026-09-15, not a new finding.
#   * the established pattern is to carry higher-timeframe state as raw tracker state in
#     features.metadata. Adopting it, this study COMPILES: plan_sha256
#     9c49a06f0a3d4fae53922c169ad9db88d8f8f97bddfa0d7de297a7f6657e7bf6, closure 4e28ee0a, 20
#     feature instances, 61 metadata columns, 13 each at 5m / 15m / 1h.
#   * collectors.collector_v2.aggregator.TIMEFRAME_TO_BUCKET_NS was a red herring: it constrains
#     tracker.regime.completed_state_feed, which this study does not use.
# No platform capability work is required to run this study.
# --------------------------------------------------------------------------------------------

htf_geometry_realisation:
  decision: >
    Higher-timeframe current-regime geometry (spec sections 10, 12, 14) is realised by binding one
    tracker.regime.excursion per timeframe to that timeframe's regime.dual_ema, giving running
    mfe_atr / mae_atr / pnl_atr / retained_ratio / highest_high / lowest_low / frozen_atr in that
    regime's OWN frozen ATR, plus dir / age_s / bars_in_regime / start_ns / start_price / atr from
    the regime tracker. 13 columns per timeframe at 5m, 15m and 1h.
  why_not_the_feature_family: gap G3 (see correction above); the tracker route is causal, registered and already proven.
  consequence: >
    Spec section 8's dual normalisation is satisfiable downstream because BOTH the raw price
    extremes and every per-timeframe ATR denominator are carried; no ratio is precomputed in a way
    that discards its denominator.

# --------------------------------------------------------------------------------------------
# What the compiled plan still does NOT deliver. These are real and must not be rediscovered at
# the collection stage.
# --------------------------------------------------------------------------------------------
residual_limitations:

  no_realized_terminal_pnl:
    blocks_spec_sections: [3, 19, 20, 21, 25, 27]
    status: CONFIRMED_IN_THE_COMPILED_PLAN
    finding: >
      The flip outcome kernel emits target_flip_within_horizon (boolean), flip_ts,
      time_to_flip_seconds, disposition, censored, censor_reason, observed_seconds -- and NO
      realized return. There is no exit fill, so EXIT_FILL_CONTRACT cannot be evaluated and every
      "terminal EV" the spec asks for is unavailable. outcome.kind: trade would compile but
      outcome.trade.contract is status 'candidate', "typed only -- no sink".
      This is item C1 on chore/fill_outcome_session (not started) and gap T1 in the atlas pilot.
    partial_mitigation: >
      excursion_1m.pnl_atr is carried at every checkpoint, so realized path PnL IS available up to
      max_age. It does NOT reach the terminal for any trade lasting longer than 300 s.
    entry_side_is_clean: >
      ENTRY_FILL_CONTRACT is satisfiable: the compiled plan carries entry_reference: next_bar_open,
      the executable reference. The decision-close defect found in the H050 audit is not repeated.

  first_passage_census_composed_and_proven:
    status: DONE
    blocks_spec_sections: []
    decision: >
      The 16 milestone arms (+0.25/0.50/0.75/1.00/1.50/2.00/3.00/4.00/5.00 ATR and
      -0.25/0.50/0.75/1.00/1.50/2.00/3.00 ATR) are composed, each with its own 24h horizon,
      expiry: censor, and composition: OR. The kernel becomes 'composite'.
    encoding: >
      BarrierArm.adverse_atr is a required float and there is no native one-sided first-passage
      item, so each arm parks its unused side at 99.0 ATR (~2,000-6,000 NQ points, unreachable in
      the window). This IS the current Platform V2-compatible mechanism, but it is an encoding.
      Polarity: a favorable arm resolves POSITIVE when +X ATR is first reached; an adverse arm
      resolves NEGATIVE when -X ATR is first reached. _resolution_seconds is measured from the
      EXECUTABLE ENTRY FILL in both cases.
    not_truncated_at_T300: >
      Arms carry their own horizon, independent of population.cadence.max_age, and
      LabelOutcomeKernel._complete holds the row until EVERY arm and the flip resolve. Proven:
      fixture case milestone_past_T300 records first passage at 1201 s, matching the oracle.
    proof: >
      fixtures/first_passage_parity.py drives the real LabelOutcomeKernel against synthetic bars
      and compares all 16 arms to an independent brute-force oracle. FIRST_PASSAGE_INTEGRITY =
      PASS over 4 cases (favorable-then-adverse order, adverse-then-favorable order, milestone
      past T300, parked side never fires): every first-passage second matches the oracle exactly
      and every disposition polarity is correct. Card: fixtures/first_passage_parity.json.
    trap_for_analysis: >
      The ROW-LEVEL composite columns are meaningless here. Any arm that never touches expires
      CENSORED, and _compose returns CENSORED if any child is unresolved, so row `censored` is 1
      and `disposition` is CENSORED on virtually every row. Read the per-arm
      fp_*_disposition / fp_*_resolution_seconds columns, never the row-level composite label.

  composite_kernel_discards_the_flip_terminal:
    status: BLOCKING_DEFECT_FOUND_BY_THE_FIXTURE
    blocks_spec_sections: [2, 19, 20, 21]
    finding: >
      research_workflow/host/outcomes.py LabelOutcomeKernel._emit, for kernel 'composite', sets
      flip_ts = at if disp == POSITIVE else None -- discarding the p.flip_ts the kernel already
      recorded. Because the composite disposition is CENSORED on virtually every row (see the
      trap above), flip_ts and time_to_flip_seconds are NULL on virtually every row.
      Measured: null in 4 of 4 fixture cases, including cases where a qualifying opposite flip
      was delivered to on_flip and correctly stored in p.flip_ts.
    consequence: >
      Composing the milestone arms COSTS the terminal-flip timestamp that the pure flip kernel
      provided. With the current kernel the study can have exact milestones OR the lifecycle
      terminal, not both. This is why the repair is a prerequisite and not an optimisation.
    fix_scope: >
      One line in _emit (carry p.flip_ts through for composite), plus the C1 exit fill and
      realized PnL below. Both live in research_workflow/host/outcomes.py; emitting new columns
      also needs research_workflow/grammar/compiler.py.

  checkpoint_window_is_300s:
    finding: >
      population.cadence.max_age is 300 s, per spec section 5 (T0..T300). Trades whose regime runs
      longer are observed only over their first 300 s. The flip terminal instant is still recorded
      (flip_ts, time_to_flip_seconds), but no state is sampled between 300 s and the flip.

  label_column_rename_not_applied:
    finding: >
      study.yaml declares label_column: target_next_flip_1m, but the compiled observation block
      names the column target_flip_within_horizon. Cosmetic; read the plan, not the spec, for the
      column name.

