## Model-integrity declarations

`docs/RESEARCH_WORKFLOW.md` §6.2 separates implemented hard gates, available diagnostics and
recommended checks. Hold the study to the right standard for each:

- A hard gate that did not run, or ran and failed, is a `FAIL`.
- A recommended check the study **claims** it performed must have evidence. A claim without an
  artifact is `NOT VERIFIED`.
- A reported **delta between model arms** must state which integrity checks were verified: are
  the added features populated, do they have variance, do the arms produce genuinely different
  scores? Identical `fit_identity_sha256` or `prediction_identity` means the added block is
  dead and the delta is an artefact. If unaddressed, the delta is `NOT VERIFIED`.
- Do **not** report a recommended check as a violated gate. Report it as a missing declaration.

## Output contract

`<study_dir>/audit/contract_pass_<NN>.md`, with `audit_type: "contract"` in the summary block
(`AGENTS.md` § Shared audit protocol), then one row per applicable requirement:

| Requirement | Verdict | Code evidence | Test evidence | Smallest remediation |

Verdicts: `PASS`, `FAIL`, `WARNING`, `NOT VERIFIED`, `NOT APPLICABLE`. Finish with
`## Blocking verdict` — exactly one of `CLEAR`, `BLOCKED`, `INCOMPLETE` — plus one paragraph.

Rules: never infer compliance without direct evidence · a passing test is insufficient if the
implementation contradicts the contract · correct-looking code with no relevant test is
`NOT VERIFIED`, not `FAIL` · distinguish implementation defects from ambiguous specs · identify
the smallest remediation, do not redesign · cite exact paths and line ranges · never treat
