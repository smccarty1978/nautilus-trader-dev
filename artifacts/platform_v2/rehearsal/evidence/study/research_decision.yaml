# Authoritative decision contract (research_decision.yaml > SPEC.md > study.yaml > compiled_study.json > code)
study_id: rehearsal_checkpoint_norm
# RATIFIED DEVIATION 2026-09-09 -- read before the question. The originally declared treatment
# `structural_max_expansion_checkpoint_atr` is NOT a registered capability; its capability flow ended in
# SUPERVISOR_ESCALATION_REQUIRED and the owner intervened (rehearsal packet, option 2) to proceed without it
# so the full-scale lifecycle could still be measured. The deviation was first recorded only in study.yaml --
# the LOWEST precedence document -- which contract audit pass 01 (audit/contract_pass_01.md, CRITICAL-1)
# correctly refused. It is ratified HERE, at the binding level: this study is SINGLE-ARM and the
# normalization contrast is NOT measured. No comparison of the two normalizations may be claimed from it.
research_question: >-
  SINGLE-ARM (ratified deviation, see the note above). Does a regime-flip classifier fitted on the three
  available feature instances -- prior `regime_efficiency` at 1m and 5m, `rolling_giveback_atr` over a 300s
  window, and `structural_max_expansion_atr` (maximum structural expansion of the current 1m regime
  normalized by the regime-start frozen ATR) -- carry out-of-sample tail lift? Instrument NQ, one full TRAIN
  year (2023), one full OOS year (2024). Tail lift is measured on the study's OWN fitted-model scores with
  thresholds frozen on TRAIN and applied to OOS rows. The checkpoint-epoch normalization
  (`structural_max_expansion_checkpoint_atr`) is WITHDRAWN from this study's scope: it has no comparator
  frame, no fit and no deliverable here, and the question of whether it adds lift over the frozen-ATR
  normalization remains OPEN and unanswered.
status: DRAFT
dataset_id: NQ_1S_V2_GLOBEX
disposable: true
# Closure VOCABULARY: the phase-D analysis decision must be one of these terminal decisions.
# REHEARSAL_COMPLETE covers the FEATURE SURFACE as well as the stages: a closure gate that does not name the
# deliverable it vouches for cannot detect the scope loss that already happened once here (contract audit
# pass 01, WARNING-2).
terminal_decisions:
  REHEARSAL_COMPLETE: the lifecycle ran to closure on full-year TRAIN 2023 / OOS 2024, the fitted model's feature surface is EXACTLY the three ratified single-arm instances (regime_efficiency prior over 1m and 5m, rolling_giveback_atr 300s, structural_max_expansion_atr) with no instance dropped, renamed, substituted or re-parameterized, and tail_lift.json exists for the study's own fitted-model scores with TRAIN-frozen thresholds
  REHEARSAL_INCOMPLETE: a lifecycle stage, gate or deliverable is missing or invalid at the time of the analysis decision, OR the fitted feature surface differs from the three ratified instances, OR the report claims the checkpoint-vs-frozen normalization contrast that this single-arm study cannot measure
# Predeclared fork policy (WORKFLOW.md §N.4). Agents follow these instead of asking again; a genuine
# semantic choice with no policy here is still a SEMANTIC_DECISION_REQUIRED question.
autonomy_decisions:
  on_capability_gap: stop_and_handoff                # write CAPABILITY_GAP_HANDOFF, end the session; never build it here
  platform_change_required: chore_branch_and_fresh_session
  deterministic_defect: auto_fix                     # fix, add a targeted test, re-run the bounded check
  calendar_reference_parity: common_interval_exact   # exact on the common calendar interval; Globex-only rows enumerated, descriptive
  frozen_parent_model: rescore_if_authenticated      # never retrain a frozen parent
  protected_period: never_expand_authority
  platform_merge: approval_required                  # a capability merge to main needs the owner's approval
