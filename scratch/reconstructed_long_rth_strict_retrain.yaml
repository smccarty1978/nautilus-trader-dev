  type: flip_prediction
  risk_tier: 2
  description: "Strict Symmetric Long Flip Model Training & Evaluation Study."

operation:
  kind: train_evaluate
  target_metric: pr_auc

instrument:
  symbol: NQ
  venue: XCME

population:
  type: regime_state
  prevailing_regime: bearish
  session: RTH
  qualification:
