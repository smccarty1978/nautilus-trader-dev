    max_depth: 3
    max_iter: 200
    random_state: 42

chronology:
  train: [2021, 2022, 2023, 2024]
  dev: [2025]
  prohibited: [2026]

execution:
  runtime: nautilustrader
  strategy_class: strategies.flip_prediction_collector.FlipPredictionCollector
  progress_seconds: 60
  bounded: true
