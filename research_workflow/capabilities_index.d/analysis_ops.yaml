# Registration index for the `analysis_ops` capability kind.
#
# It has its own file because it has its own registration boundary (research/analysis/ops.py), and a
# boundary that reads the shared index makes every other kind's edit look like a change to
# everything that boundary serves. `research cap generate` merges every file in this
# directory into the one registry; `research cap list/search/describe` are unchanged.
# See docs/RESEARCH_WORKFLOW.md §21.14.
analysis_ops:
  # Generic, study-agnostic post-collection operations consumed by the declarative
  # `analysis:` section of study.yaml and executed by the v2 `analyze` stage. They read
  # named columns off a study's own collected frame and take their science from declared
  # parameters -- none of them knows what any particular study is about. They run AFTER
  # collection and may read outcome columns; they are never a feature surface.
  - id: analysis.anchor.first_threshold_crossing
    version: 1
    description: The first row per group whose declared per-arm value reaches its declared per-arm threshold, optionally restricted to an eligibility subset; at most one anchor per group.
    implementation: research.analysis.diagnostic_ops.anchor_first_threshold_crossing
    inputs: []
    needs_context: false
    parameters: [by, group_by, order_by, eligible_column, eligible_when, inclusive, terminal]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.incidence.cumulative
    version: 1
    description: Right-censoring-aware cumulative and incremental event incidence over declared horizons, with an explicit per-horizon eligible-n and optional strata.
    implementation: research.analysis.diagnostic_ops.cumulative_incidence
    inputs: []
    needs_context: false
    parameters: [horizons, resolved_column, duration_column, observed_seconds_column, strata, duration_unit, observed_unit]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.decomposition.buckets
    version: 1
    description: Mutually exclusive, declaration-ordered partition of a censored duration into declared buckets, reported against both an all-rows and a negative-at-N denominator.
    implementation: research.analysis.diagnostic_ops.bucket_decomposition
    inputs: []
    needs_context: false
    parameters: [buckets, resolved_column, duration_column, observed_seconds_column, negative_after_seconds, terminal_column, strata]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.control.cell_matched
    version: 1
    description: Deterministic predeclared control selection -- at most one below-threshold row per group and stratum cell, strictly before the anchor where one exists; min-n reportability gate, no matching or weighting.
    implementation: research.analysis.diagnostic_ops.cell_matched_controls
    inputs:
    - anchors
    needs_context: false
    parameters: [anchors, by, group_by, strata, order_by, min_n, eligible_column, eligible_when, terminal]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.path.anchored_offsets
    version: 1
    description: The value path at declared offsets after an anchor bounded by its terminal, with delta, maximum, time-to-level, collapse and recross summaries; a missing required offset censors the path rather than being imputed.
    implementation: research.analysis.diagnostic_ops.anchored_path
    inputs:
    - anchors
    needs_context: false
    parameters: [anchors, by, group_by, order_by, offsets, max_offset_seconds, terminal_column, levels, time_unit]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.classify.precedence
    version: 1
    description: Ordered first-match-wins categorical labelling; declaration order is the precedence, so a dominating category is expressed by declaring it first.
    implementation: research.analysis.diagnostic_ops.precedence_labels
    inputs: []
    needs_context: false
    parameters: [rules, output_column, strata]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.gate.population_parity
    version: 1
    description: STOP GATE - raises unless the population is identical to a frozen reference (declared sha256, total, per-stratum counts, exact key set, per-key instant); aborts the analyze stage before any artifact is written.
    implementation: research.analysis.diagnostic_ops.population_parity_gate
    inputs: []
    needs_context: true
    parameters: [reference_path, reference_sha256, key, reference_key, expected_total, expected_by, timestamp_column, reference_timestamp_column, value_map]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.gate.arm_delta_integrity
    version: 1
    description: STOP GATE - raises unless every non-baseline arm's ADDED feature block is populated and varying on the rebuilt fitted population and produced a model whose fit identity and predictions differ from the baseline arm's, per declared cell; aborts the analyze stage before any arm delta is written.
    implementation: research.analysis.diagnostic_ops.arm_delta_integrity_gate
    inputs: []
    needs_context: true
    parameters: [baseline_arm, scope, min_non_null_rate, require_positive_variance, require_distinct_fit_identity, require_distinct_predictions, min_prediction_divergence, models_manifest, study_id]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.metric.tail_lift
    version: 1
    description: Label-rate lift inside the score tail at thresholds frozen from a declared reference frame (per-group quantiles applied to the evaluation rows; censored rows excluded and counted).
    implementation: research.analysis.diagnostic_ops.tail_lift
    inputs:
    - reference
    needs_context: false
    parameters: [score, label, quantiles, group_by, interpolation]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_diagnostic_ops.py]
  - id: analysis.describe.grouped
    version: 1
    description: Grouped descriptive summary -- n, mean, median, std, min, max and declared quantiles per value column and declared group; censored rows excluded and counted; every cell carries its row count AND its session-day cluster count (a cluster declaration is required).
    implementation: research.analysis.diagnostic_ops.grouped_summary
    inputs: []
    needs_context: false
    parameters: [value_columns, group_by, quantiles, censored_column, cluster_column, cluster_ts_column]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_summary_ops.py]
  - id: analysis.uncertainty.clustered_mean
    version: 1
    description: Session-day-clustered (CR1) standard errors and t confidence intervals for every mean and declared difference of means, per value column and declared group; n_rows AND n_clusters are required output fields; fewer than two clusters reports counts with a null SE.
    implementation: research.analysis.diagnostic_ops.clustered_uncertainty
    inputs: []
    needs_context: false
    parameters: [value_columns, group_by, cluster_column, cluster_ts_column, censored_column, confidence, differences]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_summary_ops.py]
  - id: analysis.derive.columns
    version: 1
    description: Declared row-wise column derivation in a bounded, parsed (never eval-ed) expression grammar -- arithmetic, comparisons, three-valued logic and a closed function whitelist (abs, sign, sqrt, min, max, is_null, not_null, where, coalesce, concat, cut); explicit NULL propagation and divide-by-zero policy; optional row filter; no aggregation, no cross-row access; the compiler refuses any column the plan does not provide.
    implementation: research.analysis.derive_ops.derive_columns
    inputs: []
    needs_context: false
    parameters: [columns, keep, div_zero]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_derive_ops.py]
  - id: analysis.contrast.nominate
    version: 1
    description: Frozen nomination rules over parent/child contrasts -- child minus rest-of-parent with session-day-clustered CR1 intervals (the clustered_mean difference estimator), declared support gates, Benjamini-Hochberg over the whole tested family, declared absolute/relative/CI/q materiality gates; emits every contrast in key order (never ranked) and a claim file freezing the specification, gates, replication rules and claims.
    implementation: research.analysis.contrast_ops.contrast_nominate
    inputs: []
    needs_context: false
    parameters: [mode, parent_by, dimensions, metrics, cluster_column, cluster_ts_column, censored_column, exclude_child_values, n_basis, confidence, gates, materiality, bh_null_policy, key_columns, replication, contrasts]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_contrast_ops.py]
  - id: analysis.replication.scorecard
    version: 1
    description: Re-measures every claim of a hash-pinned contrast.nominate claim file on the replication rows with the file's own contrast specification and classifies each by the file's own ordered rules; refuses a changed file, never drops, adds or re-thresholds a claim.
    implementation: research.analysis.contrast_ops.replication_scorecard
    inputs: []
    needs_context: true
    parameters: [claims_path, claims_sha256]
    update_cadence: offline_only
    required_tests: [research/analysis/tests/test_contrast_ops.py]
